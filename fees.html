function normalizePK(num) {
  let d = String(num || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '92' + d.slice(1);
  else if (d.length === 10 && d.startsWith('3')) d = '92' + d;
  return d;
}

async function fetchAllBy(build) {
  let out = [], from = 0;
  while (true) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}

function makeBill(s, y, m) {
  const vs = vsOf(s.id);
  const v = vs.find(x => x.fee_year === y && x.fee_month === m);
  if (!v) return null;
  const k = pKey(y, m);
  const older = vs.filter(x => pKey(x.fee_year, x.fee_month) < k)
    .sort((a, b) => pKey(a.fee_year, a.fee_month) - pKey(b.fee_year, b.fee_month));
  const prevAmt = older.reduce((a, x) => a + Number(x.outstanding || 0), 0);
  const total = prevAmt + Number(v.amount_due || 0);
  const rem = prevAmt + Number(v.outstanding || 0);
  const paid = Math.max(0, total - rem);
  return { s, v, y, m, older, prevAmt, total, paid, rem, cls: cls(s.class_id), due: `10/${pad(m)}/${y}` };
}
const billFor = s => { const p = period(); return makeBill(s, p.y, p.m); };

async function loadAll() {
  const [c1, c2, c3] = await Promise.all([
    sb.from('classes').select('id,name,base_fee,sort_order').order('sort_order'),
    sb.from('students').select('*').eq('is_active', true),
    sb.from('fee_settings').select('*').eq('id', 1).maybeSingle()
  ]);
  if (c1.error || c2.error) return toast('لوڈ نہیں ہوا: ' + ((c1.error || c2.error).message), true);
  state.classes = c1.data || [];
  state.students = (c2.data || []).sort(byAdm);
  state.settings = (c3 && c3.data) || {};
  const ids = state.students.map(s => s.id);
  state.vouchers = ids.length
    ? await fetchAllBy(() => sb.from('fee_voucher_status').select('*').in('student_id', ids))
    : [];
  state.setSel = state.students.find(x => x.id === state.setSel?.id) || null;
  state.qSel = state.students.find(x => x.id === state.qSel?.id) || null;
  fillCls();
  if (state.pendingAdm) {
    const s = findByAdm(state.pendingAdm);
    state.pendingAdm = null;
    if (s) { showTab('pay', false); state.qSel = s; }
  }
  renderAll();
}

async function refreshPayList() {
  let from, to;
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (state.payMode === 'range') {
    const f = $('pFrom').value, t = $('pTo').value;
    if (!f || !t) return;
    const [a, b, c] = f.split('-').map(Number), [d, e, g] = t.split('-').map(Number);
    from = new Date(a, b - 1, c); to = new Date(d, e - 1, g + 1);
  } else if (state.payMode === 'yesterday') {
    from = new Date(d0.getTime() - 864e5); to = d0;
  } else if (state.payMode === 'week') {
    from = new Date(d0.getTime() - 6 * 864e5); to = new Date(d0.getTime() + 864e5);
  } else {
    from = d0; to = new Date(d0.getTime() + 864e5);
  }
  const { data, error } = await sb.from('fee_payments').select('*')
    .gte('paid_at', from.toISOString()).lt('paid_at', to.toISOString())
    .order('paid_at', { ascending: true });
  if (error) return toast('لوڈ نہیں ہوا: ' + error.message, true);
  state.payList = data || [];
  applyUi();
  renderPayList();
}

function sendAllPayList() {
  const sum = new Map(), rc = new Map();
  state.payList.forEach(p => {
    sum.set(p.student_id, (sum.get(p.student_id) || 0) + Number(p.amount));
    rc.set(p.student_id, p.receipt_no);
  });
  const list = [...sum.keys()].map(id => {
    const s = state.students.find(x => x.id === id);
    if (!s) return null;
    return { s, text: rcptText(s, sum.get(id), rc.get(id), owedOf(id), Number(s.credit || 0), state.ml) };
  }).filter(Boolean);
  if (!list.length) return toast(plain('noPay'), true);
  qList = list; qIdx = 0; qLast = 0;

}
function drawQueue() {
  clearTimeout(qTimer);
  const left = qLast + COOL - Date.now();
  const cur = qList[qIdx];
  const label = !cur ? '✅ ' + plain('done') : left > 0 ? `⏳ ${Math.ceil(left / 1000)}` : `▶ ${cur.s.name}`;
  openM(plain('sendAll'), `<p class="hint">${plain('queueHint')}</p>
    <div class="row2"><button class="btn b-wa" data-act="qNext" ${(!cur || left > 0) ? 'disabled' : ''}>${label}</button>
    <span class="hint">${qIdx} / ${qList.length}</span></div>`);
  if (cur && left > 0) qTimer = setTimeout(drawQueue, left + 50);
}
function qNext() {
  const cur = qList[qIdx];
  if (!cur) return;
  sendWa(cur.s, cur.text);
  qLast = Date.now();
  qIdx++;
  drawQueue();
}

async function runReport() {
  const type = $('rType').value, cid = $('rCls').value, p = period(), now = new Date();
  let from, to, title;
  if (type === 'weekly') {
    const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    from = new Date(d0.getTime() - 6 * 864e5); to = new Date(d0.getTime() + 864e5);
    title = plain('weekly');
  } else if (type === 'monthly') {
    from = new Date(p.y, p.m - 1, 1); to = new Date(p.y, p.m, 1);
    title = `${plain('monthly')} — ${ME[p.m - 1]} ${p.y}`;
  } else {
    from = new Date(p.y, 0, 1); to = new Date(p.y + 1, 0, 1);
    title = `${plain('annual')} — ${p.y}`;
  }
  const { data, error } = await sb.from('fee_payments').select('student_id,amount')
    .gte('paid_at', from.toISOString()).lt('paid_at', to.toISOString());
  if (error) return toast('ناکام: ' + error.message, true);
  const paid = new Map();
  (data || []).forEach(r => paid.set(r.student_id, (paid.get(r.student_id) || 0) + Number(r.amount)));
  const list = state.students.filter(s => cid === 'all' || String(s.class_id) === cid)
    .sort((a, b) => (a.class_id - b.class_id) || byAdm(a, b));
  let html = `<h4 style="text-align:center">${title}</h4>
    <table class="list"><tr><th>#</th><th>${plain('adm')}</th><th>${plain('name')}</th><th>${plain('cls')}</th><th>${plain('paidAmt')}</th><th>${plain('totalDue')}</th></tr>`;
  let gp = 0, gd = 0, cp = 0, cd = 0, lastCls = null, i = 0;
  const flush = () => {
    if (lastCls !== null) html += `<tr class="tot"><td colspan="4">${plain('subtotal')} — ${esc(cls(lastCls))}</td><td>${money(cp)}</td><td>${money(cd)}</td></tr>`;
  };
  list.forEach(s => {
    if (s.class_id !== lastCls) { flush(); cp = 0; cd = 0; lastCls = s.class_id; }
    const pd = paid.get(s.id) || 0, od = owedOf(s.id);
    cp += pd; cd += od; gp += pd; gd += od; i++;
    html += `<tr><td>${i}</td><td>${esc(s.admission_no)}</td><td>${esc(s.name)}</td><td>${esc(cls(s.class_id))}</td><td>${money(pd)}</td><td>${money(od)}</td></tr>`;
  });
  flush();
  html += `<tr class="tot"><td colspan="4">${plain('grand')}</td><td>${money(gp)}</td><td>${money(gd)}</td></tr></table>`;
  state.lastReport = html;
  setT('rOut', html);
}

async function applyPct(pct) {
  const ids = [...state.bChk];
  if (!ids.length) return toast(plain('pickFirst'), true);
  if (!(pct > 0 && pct <= 100)) return toast('1 سے 100 کے درمیان فیصد لکھیں', true);
  const cid = $('bCls').value;
  const cl = state.classes.find(c => String(c.id) === cid);
  const base = Number(cl?.base_fee || 0);
  if (!base) return toast('پہلے کلاس کی فیس محفوظ کریں', true);
  const newFee = Math.round(base * pct / 100);
  const p = period();
  let n = 0;
  for (const id of ids) {
    const { error } = await sb.from('students').update({ monthly_fee: newFee, fee_concession_pct: 0 }).eq('id', id);
    if (error) return toast(error.message, true);
    const v = state.vouchers.find(x => x.student_id === id && x.fee_year === p.y && x.fee_month === p.m);
    if (v) {
      const { error: e2 } = await sb.from('fee_vouchers').update({ base_fee: newFee, sibling_discount: 0, concession: 0 }).eq('id', v.id);
      if (e2) return toast(e2.message, true);
    }
    n++;
  }
  state.bChk.clear();
  toast(`✅ ${n} طلباء: ${pct}% (${money(newFee)})`);
  loadAll();
}

  const fromTs = new Date(p.y, p.m - 1, 1).toISOString();
  const toTs = new Date(p.y, p.m, 1).toISOString();
  const [{ data: ex, error: e1 }, { data: fp, error: e2 }] = await Promise.all([
    sb.from('expenses').select('*').gte('expense_date', start).lt('expense_date', end).order('expense_date', { ascending: false }),
    sb.from('fee_payments').select('amount').gte('paid_at', fromTs).lt('paid_at', toTs)
  ]);
  if (e1 || e2) return toast((e1 || e2).message, true);
  state.expRows = ex || [];
  state.feeIncome = (fp || []).reduce((a, x) => a + Number(x.amount), 0);
  renderExp();
}
function renderExp() {
  const rows = state.expRows;
  const manualIn = rows.filter(x => x.kind === 'income').reduce((a, x) => a + Number(x.amount), 0);
  const outs = rows.filter(x => x.kind !== 'income').reduce((a, x) => a + Number(x.amount), 0);
  const totalIn = state.feeIncome + manualIn;
  const bal = totalIn - outs;
  const kp = (v, l, c = '#3730a3') => `<div class="kpi"><b style="color:${c}">${v}</b><span>${l}</span></div>`;
  setT('expK',
    kp(money(state.feeIncome), ui('autoFee'), '#15803d') +
    kp(money(manualIn), ui('incomeT'), '#15803d') +
    kp(money(totalIn), ui('totalIncome'), '#15803d') +
    kp(money(outs), ui('expenseT'), '#dc2626') +
    kp(money(bal), ui('balance'), bal >= 0 ? '#15803d' : '#dc2626'));
  setT('eTb', `<tr><td>—</td><td>${ui('income')}</td><td>${ui('autoFee')}</td><td>${money(state.feeIncome)}</td><td>—</td><td>—</td></tr>` +
    rows.map(x => `<tr><td>${x.expense_date}</td><td>${x.kind === 'income' ? ui('income') : ui('expense')}</td>
      <td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.note || '')}</td>
      <td><button class="btn sm b-red" data-act="eDel" data-id="${x.id}">🗑️ ${ui('del')}</button></td></tr>`).join(''));
}
async function saveExp() {
  const kind = $('eKind').value, cat = $('eCat').value.trim(), amt = Number($('eAmt').value || 0);
  const date = $('eDate').value || todayStr(), note = $('eNote').value.trim();
  if (!cat || !(amt > 0)) return toast(plain('needCatAmt'), true);
  const { error } = await sb.from('expenses').insert({ kind, category: cat, amount: amt, note: note || null, expense_date: date });
  if (error) return toast(error.message, true);
  $('eCat').value = ''; $('eAmt').value = ''; $('eNote').value = '';
  toast('✅ ' + plain('save'));
  loadExp();
}
async function deleteExp(id) {
  if (!confirm(plain('del') + '?')) return;
  const { error } = await sb.from('expenses').delete().eq('id', id);
  if (error) return toast(error.message, true);
  loadExp();
}

function closeApp() {
  if (!confirm('سافٹ ویئر بند کریں؟ / Close software?')) return;
  sb.auth.signOut();
  toast(plain('closedMsg'));
  try { window.close(); } catch (e) {}
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-act],[data-dst],[data-k]');
  if (!t) return;
  if (t.dataset.tab) return showTab(t.dataset.tab);
  if (t.dataset.dst) {
    state.defFilter = t.dataset.dst;
    store.set('deffilter', state.defFilter);
    return renderDef();
  }
  if (t.dataset.k) {
    state.payMode = t.dataset.k;
    return refreshPayList();
  }
  const a = t.dataset.act;
  const id = Number(t.dataset.id);
  const s = state.students.find(x => x.id === id);
  switch (a) {
    case 'back': goBack(); break;
    case 'qFind': lookupAdm(); break;
    case 'pay': await payFromEnter(); break;
    case 'pd': if (s) await paymentDetail(s); break;
    case 'pdPrint': if (s) printPaymentDetail(s); break;
    case 'editPay': openPayEdit(id, t.dataset.amt); break;
    case 'savePay': savePay(id); break;
    case 'editBill': if (s) openBillEdit(s); break;
    case 'saveBill': saveBill(Number(t.dataset.vid)); break;
    case 'rPrint': {
      const r = state.rcpt, rs = r && state.students.find(x => x.id === r.sid);
      if (rs) printDoc(receiptHTML(r, rs, state.bl), 'A4', 'portrait');
      break;
    }
    case 'rImg': {
      const r = state.rcpt, rs = r && state.students.find(x => x.id === r.sid);
      if (rs) shareReceiptImage(r, rs);
      break;
    }
    case 'rWa': case 'rSms': {
      const r = state.rcpt, rs = r && state.students.find(x => x.id === r.sid);
      if (!rs) break;
      const txt = rcptText(rs, r.amount, r.receipt, owedOf(rs.id), Number(rs.credit || 0), state.ml);
      a === 'rWa' ? sendWa(rs, txt) : sendSms(rs, txt);
      break;
    }
    case 'rePrint': rePrintPayment(id); break;
    case 'pImg': { const x = await paymentById(id); if (x) shareReceiptImage(x.r, x.s); break; }
    case 'pWa': case 'pSms': {
      const x = await paymentById(id);
      if (!x) break;
      const txt = rcptText(x.s, x.p.amount, x.p.receipt_no, owedOf(x.s.id), Number(x.s.credit || 0), state.ml);
      a === 'pWa' ? sendWa(x.s, txt) : sendSms(x.s, txt);
      break;
    }
    case 'plPrint': printPayList(); break;
    case 'plSendAll': sendAllPayList(); break;
    case 'qNext': qNext(); break;
    case 'prB': if (s) printBills([billFor(s)].filter(Boolean)); break;
    case 'imgB': if (s) shareImage(billFor(s)); break;
    case 'waB': {
      const b = s && billFor(s);
      if (!b) return toast(plain('noVoucher'), true);
      sendWa(s, billText(b, state.ml));
      break;
    }
    case 'bAll': printBills(filt().map(billFor).filter(Boolean)); break;
    case 'bSel': printBills([...state.checked].map(x => state.students.find(y => y.id === x)).filter(Boolean).sort(byAdm).map(billFor).filter(Boolean)); break;
    case 'noteOpen': openNote(); break;
    case 'saveNote': saveNote(); break;
    case 'remOpen': openReminder(); break;
    case 'saveRem': store.set('remTplCustom', $('rTpl').value); toast('✅ ' + plain('save')); $('modal').hidden = true; break;
    case 'rApply': state.defMin = $('rMin').value; state.defMax = $('rMax').value; renderDef(); break;
    case 'dPrint': printDefaulters(); break;
    case 'dSendTick': sendToTicked(); break;
    case 'dWa': if (s) sendWa(s, remText(s)); break;
    case 'dSms': if (s) sendSms(s, remText(s)); break;
    case 'dCall':
      if (s) openM(`📞 ${s.name}`, `<div class="row2">
        <button class="btn b-wa" data-act="cWa" data-id="${s.id}">📱 ${plain('wa')} ${plain('call')}</button>
        <button class="btn b-call" data-act="cSim" data-id="${s.id}">📞 SIM ${plain('call')}</button></div>`);
      break;
    case 'cWa': if (s) callWa(s); break;
    case 'cSim': if (s) callSim(s); break;
    case 'reportOpen': openReport(); break;
    case 'runReport': runReport(); break;
    case 'printReport': if (state.lastReport) printDoc(state.lastReport, paper().size, paper().orient); break;
    case 'eSave': saveExp(); break;
    case 'eDel': deleteExp(id); break;
    case 'saveCls': {
      const v = Number($('cf' + id).value || 0);
      const { error } = await sb.from('classes').update({ base_fee: v }).eq('id', id);
      if (error) return toast('ناکام: ' + error.message, true);
      toast('✅ ' + plain('save')); loadAll();
      break;
    }
    case 'pct': applyPct(Number(t.dataset.pct)); break;
    case 'pctCustom': applyPct(Number($('bCustom').value)); break;
    case 'bSelAll': state.bChk = new Set(state.students.filter(x => String(x.class_id) === $('bCls').value).map(x => x.id)); renderBulk(); break;
    case 'bSelNone': state.bChk.clear(); renderBulk(); break;
    case 'sPick': state.setSel = s; renderSetEd(); break;
    case 'sSave': {
      const ov = Number($('sOv').value || 0);
      const { error } = await sb.from('students').update({ monthly_fee: ov > 0 ? ov : 0, fee_concession_pct: 0 }).eq('id', id);
      if (error) return toast('ناکام: ' + error.message, true);
      toast('✅ ' + plain('save')); loadAll();
      break;
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'qAdm') { e.preventDefault(); lookupAdm(); }
  else if (e.target.id === 'pAmt') { e.preventDefault(); payFromEnter(); }
  else if (e.target.id === 'pNote') { e.preventDefault(); payFromEnter(); }
});

document.addEventListener('change', e => {
  const c = e.target;
  if (c.dataset.chk) {
    const id = Number(c.dataset.chk);
    c.checked ? state.checked.add(id) : state.checked.delete(id);
    return;
  }
  if (c.dataset.bchk) {
    const id = Number(c.dataset.bchk);
    c.checked ? state.bChk.add(id) : state.bChk.delete(id);
    return;
  }
  if (c.dataset.dchk) {
    const id = Number(c.dataset.dchk);
    c.checked ? state.dChk.add(id) : state.dChk.delete(id);
    return;
  }
  if (c.id === 'colorOn') { state.colorOn = c.checked; store.set('colorOn', c.checked ? '1' : '0'); renderDef(); return; }
  if (c.id === 'bCls') { state.bChk.clear(); renderBulk(); return; }
  if (c.id === 'pY' || c.id === 'pM' || c.id === 'pC') { renderAll(); if (state.curTab === 'exp') loadExp(); return; }
  if (c.id === 'mlang') { state.ml = c.value; store.set('mlang', c.value); }
  if (c.id === 'blang') { state.bl = c.value; store.set('blang', c.value); renderAll(); }
  if (c.id === 'uilang') { state.uiLang = c.value; store.set('uilang', c.value); renderAll(); }
  if (c.id === 'dueMode') renderBills();
  if (c.id === 'pFrom' || c.id === 'pTo') { if (state.payMode === 'range') refreshPayList(); }
});

$('sQ').addEventListener('input', renderSetSearch);
$('bQ').addEventListener('input', renderBills);
$('rMin').addEventListener('input', e => state.defMin = e.target.value);
$('rMax').addEventListener('input', e => state.defMax = e.target.value);
$('backBtn').onclick = () => goBack();
$('closeBtn').onclick = closeApp;
$('lBtn').onclick = async () => {
  $('lMsg').textContent = '';
  const phone = normalizePK($('lPhone').value.trim());
  if (!isValidMobile(phone)) return $('lMsg').textContent = 'موبائل نمبر درست نہیں';
  const { error } = await sb.auth.signInWithPassword({ email: phone + DOMAIN, password: $('lPass').value });
  if (error) $('lMsg').textContent = 'موبائل نمبر یا پاس ورڈ غلط ہے';
};
$('logout').onclick = () => sb.auth.signOut();

function handleSession(session) {
  if (!session) {
    state.user = null; state.inited = false;
    $('login').hidden = false; $('app').hidden = true;
    return;
  }
  state.user = session.user;
  $('login').hidden = true; $('app').hidden = false;
  $('who').textContent = '👤 ' + (session.user.email || '').replace(DOMAIN, '');
  if (!state.inited) { state.inited = true; initPeriod(); loadAll(); refreshPayList(); }
}
(async () => {
  applyUi();
  const { data } = await sb.auth.getSession();
  handleSession(data.session);
  sb.auth.onAuthStateChange((_e, session) => handleSession(session));
  showTab('gen', false);
})();
</script>
  <script src="perm.js"></script>
<script>initPerms(sb);</script>
</body>
