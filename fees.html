function normalizePK(num) {

  return d;
}

async function fetchAllBy(build) {
  let out = [], from = 0;
  while (true) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}

function makeBill(s, y, m) {
  const vs = vsOf(s.id);
  const v = vs.find(x => x.fee_year === y && x.fee_month === m);
  if (!v) return null;
  const k = pKey(y, m);
  const older = vs.filter(x => pKey(x.fee_year, x.fee_month) < k)
    .sort((a, b) => pKey(a.fee_year, a.fee_month) - pKey(b.fee_year, b.fee_month));
  const prevAmt = older.reduce((a, x) => a + Number(x.outstanding || 0), 0);
  const total = prevAmt + Number(v.amount_due || 0);
  const rem = prevAmt + Number(v.outstanding || 0);
  const paid = Math.max(0, total - rem);
  return { s, v, y, m, older, prevAmt, total, paid, rem, cls: cls(s.class_id), due: `10/${pad(m)}/${y}` };
}

async function refreshPayList() {
  let from, to;
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (state.payMode === 'range') {
    const f = $('pFrom').value, t = $('pTo').value;
    if (!f || !t) return;
    const [a, b, c] = f.split('-').map(Number), [d, e, g] = t.split('-').map(Number);
    from = new Date(a, b - 1, c); to = new Date(d, e - 1, g + 1);
  } else if (state.payMode === 'yesterday') {
    from = new Date(d0.getTime() - 864e5); to = d0;
  } else if (state.payMode === 'week') {
    from = new Date(d0.getTime() - 6 * 864e5); to = new Date(d0.getTime() + 864e5);
  } else {
    from = d0; to = new Date(d0.getTime() + 864e5);
  }
  const { data, error } = await sb.from('fee_payments').select('*')
    .gte('paid_at', from.toISOString()).lt('paid_at', to.toISOString())
    .order('paid_at', { ascending: true });
  if (error) return toast('لوڈ نہیں ہوا: ' + error.message, true);
  state.payList = data || [];
  applyUi();
  renderPayList();
}

function sendAllPayList() {
  const sum = new Map(), rc = new Map();
  state.payList.forEach(p => {
    sum.set(p.student_id, (sum.get(p.student_id) || 0) + Number(p.amount));
    rc.set(p.student_id, p.receipt_no);
  });
  const list = [...sum.keys()].map(id => {
    const s = state.students.find(x => x.id === id);
    if (!s) return null;
    return { s, text: rcptText(s, sum.get(id), rc.get(id), owedOf(id), Number(s.credit || 0), state.ml) };
  }).filter(Boolean);
  if (!list.length) return toast(plain('noPay'), true);
  qList = list; qIdx = 0; qLast = 0;
  drawQueue();
}
function drawQueue() {
  clearTimeout(qTimer);
  const left = qLast + COOL - Date.now();
  const cur = qList[qIdx];
  const label = !cur ? '✅ ' + plain('done') : left > 0 ? `⏳ ${Math.ceil(left / 1000)}` : `▶ ${cur.s.name}`;
  openM(plain('sendAll'), `<p class="hint">${plain('queueHint')}</p>
    <div class="row2"><button class="btn b-wa" data-act="qNext" ${(!cur || left > 0) ? 'disabled' : ''}>${label}</button>
    <span class="hint">${qIdx} / ${qList.length}</span></div>`);
  if (cur && left > 0) qTimer = setTimeout(drawQueue, left + 50);
}
function qNext() {
  const cur = qList[qIdx];
  if (!cur) return;
  sendWa(cur.s, cur.text);
  qLast = Date.now();
  qIdx++;
  drawQueue();
}

  }).join('') || `<tr><td colspan="10">${ui('noMatch')}</td></tr>`;
}

function renderDef() {
  $('dTb').innerHTML = defList().map((s, i) => `<tr>
    <td>${i + 1}</td><td>${esc(s.name)}</td><td>${esc(s.admission_no)}</td><td>${esc(cls(s.class_id))}</td>
    <td>${esc(s.mobile)}</td><td><b>${money(owedOf(s.id))}</b></td>
    <td>${statusOf(s.id) === 'partial' ? ui('partial') : ui('notPaid')}</td>
    <td class="nw">
      <button class="btn sm b-wa" data-act="dWa" data-id="${s.id}">WA</button>
      <button class="btn sm b-sms" data-act="dSms" data-id="${s.id}">SMS</button>
      <button class="btn sm b-call" data-act="dCall" data-id="${s.id}">📞</button>
    </td></tr>`).join('') || `<tr><td colspan="8">${ui('noMatch')}</td></tr>`;
  document.querySelectorAll('[data-dst]').forEach(b => b.classList.toggle('sel', b.dataset.dst === state.defFilter));
}
function printDefaulters() {
  const list = defList();
  if (!list.length) return toast(plain('noMatch'), true);
  const p = period(), pp = paper();
  const rows = list.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.name)}</td><td>${esc(s.admission_no)}</td><td>${esc(cls(s.class_id))}</td><td>${esc(s.mobile)}</td><td>${money(owedOf(s.id))}</td></tr>`).join('');
  const tot = list.reduce((a, s) => a + owedOf(s.id), 0);
  printDoc(`<h3 style="text-align:center">${lab('defT')} — ${monTxt(p.m, state.bl)} ${p.y}</h3>
    <table class="list"><tr><th>#</th><th>${lab('name')}</th><th>${lab('adm')}</th><th>${lab('cls')}</th><th>${lab('mob')}</th><th>${lab('dueT')}</th></tr>
    ${rows}<tr><th colspan="5">${lab('totalDue')}</th><th>${money(tot)}</th></tr></table>`, pp.size, pp.orient);
}

async function runReport() {
  const type = $('rType').value, cid = $('rCls').value, p = period(), now = new Date();
  let from, to, title;
  if (type === 'weekly') {
    const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    from = new Date(d0.getTime() - 6 * 864e5); to = new Date(d0.getTime() + 864e5);
    title = plain('weekly');
  } else if (type === 'monthly') {
    from = new Date(p.y, p.m - 1, 1); to = new Date(p.y, p.m, 1);
    title = `${plain('monthly')} — ${monTxt(p.m, 'en')} ${p.y}`;
  } else {
    from = new Date(p.y, 0, 1); to = new Date(p.y + 1, 0, 1);
    title = `${plain('annual')} — ${p.y}`;
  }
  const { data, error } = await sb.from('fee_payments').select('student_id,amount')
    .gte('paid_at', from.toISOString()).lt('paid_at', to.toISOString());
  if (error) return toast('ناکام: ' + error.message, true);
  const paid = new Map();
  (data || []).forEach(r => paid.set(r.student_id, (paid.get(r.student_id) || 0) + Number(r.amount)));
  const list = state.students.filter(s => cid === 'all' || String(s.class_id) === cid)
    .sort((a, b) => (a.class_id - b.class_id) || a.name.localeCompare(b.name));
  let html = `<h4 style="text-align:center">${title}</h4>
    <table class="list"><tr><th>#</th><th>${plain('name')}</th><th>${plain('adm')}</th><th>${plain('cls')}</th><th>${plain('paidAmt')}</th><th>${plain('totalDue')}</th></tr>`;
  let gp = 0, gd = 0, cp = 0, cd = 0, lastCls = null, i = 0;
  const flush = () => {
    if (lastCls !== null) html += `<tr class="tot"><td colspan="4">${plain('subtotal')} — ${esc(cls(lastCls))}</td><td>${money(cp)}</td><td>${money(cd)}</td></tr>`;
  };
  list.forEach(s => {
    if (s.class_id !== lastCls) { flush(); cp = 0; cd = 0; lastCls = s.class_id; }
    const pd = paid.get(s.id) || 0, od = owedOf(s.id);
    cp += pd; cd += od; gp += pd; gd += od; i++;
    html += `<tr><td>${i}</td><td>${esc(s.name)}</td><td>${esc(s.admission_no)}</td><td>${esc(cls(s.class_id))}</td><td>${money(pd)}</td><td>${money(od)}</td></tr>`;
  });
  flush();
  html += `<tr class="tot"><td colspan="4">${plain('grand')}</td><td>${money(gp)}</td><td>${money(gd)}</td></tr></table>`;
  state.lastReport = html;
  $('rOut').innerHTML = html.replace('class="list"', 'class="list tw"');
}

function openReport() {
  openM(plain('report'), `<div class="row2">
    <label>${plain('type')}<select id="rType">
      <option value="weekly">${plain('weekly')}</option>
      <option value="monthly">${plain('monthly')}</option>
      <option value="annual">${plain('annual')}</option></select></label>
    <label>${plain('cls')}<select id="rCls"><option value="all">${plain('allC')}</option>${state.classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
    <button class="btn b-indigo" data-act="runReport">🔍 ${plain('apply')}</button>
    <button class="btn b-purple" data-act="printReport">🖨 ${plain('print')}</button>
  </div><div id="rOut"></div>`);
}

function openNote() {
  openM(`📝 ${plain('billNote')}`, `
    <label>اردو نوٹ<textarea id="nUr" rows="3">${esc(state.settings.bill_note_ur || '')}</textarea></label>
    <label>English note<textarea id="nEn" rows="3">${esc(state.settings.bill_note_en || '')}</textarea></label>
    <label>${plain('sigA')}<input id="nAcc" value="${esc(state.settings.accountant_name || '')}"></label>
    <label><input type="checkbox" id="nBrk" ${state.settings.bill_show_breakdown !== false ? 'checked' : ''}> ${plain('dueDetail')}</label>
    <div class="ma"><button class="btn b-green" data-act="saveNote">💾 ${ui('save')}</button></div>`);
}
async function saveNote() {
  const row = {
    id: 1, bill_note_ur: $('nUr').value, bill_note_en: $('nEn').value,
    accountant_name: $('nAcc').value, bill_show_breakdown: $('nBrk').checked
  };
  const { error } = await sb.from('fee_settings').upsert(row);
  if (error) return toast('ناکام: ' + error.message, true);
  toast('✅ ' + plain('save'));
  $('modal').hidden = true;
  loadAll();
}
function openReminder() {
  const cur = store.get('remTplCustom') || state.settings.reminder_tpl_ur || '';
  openM(`✉️ ${plain('reminder')}`, `<textarea id="rTpl" rows="5">${esc(cur)}</textarea>
    <p class="hint">{name} = ${plain('name')}، {amount} = ${plain('dueT')}</p>
    <div class="ma"><button class="btn b-green" data-act="saveRem">💾 ${ui('save')}</button></div>`);
}

async function renderExp() {
  const { data } = await sb.from('expenses').select('*').order('expense_date', { ascending: false }).limit(300);
  $('eTb').innerHTML = (data || []).map(x => `<tr><td>${x.expense_date}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.note || '')}</td>
    <td><button class="btn sm b-red" data-act="eDel" data-id="${x.id}">🗑️ ${ui('del')}</button></td></tr>`).join('') || '<tr><td colspan="5">—</td></tr>';
}

function renderSet() {
  $('clsFees').innerHTML = `<table><tr><th>${ui('cls')}</th><th>${ui('fee')}</th><th></th></tr>
    ${state.classes.map(c => `<tr><td>${esc(c.name)}</td>
      <td><input type="number" min="0" id="cf${c.id}" value="${Number(c.base_fee || 0)}" style="width:120px"></td>
      <td><button class="btn sm b-green" data-act="saveCls" data-id="${c.id}">💾 ${ui('save')}</button></td></tr>`).join('')}
    </table>`;
  renderSetEd();
}
function renderSetSearch() {
  $('sRes').innerHTML = findStudents($('sQ').value).map(s =>
    `<button class="btn sm b-blue" data-act="sPick" data-id="${s.id}" style="margin:2px">${esc(s.name)} · ${esc(s.admission_no)}</button>`).join('');
}
function renderSetEd() {
  const s = state.setSel;
  if (!s) { $('sEd').innerHTML = ''; return; }
  $('sEd').innerHTML = `<h4>${esc(s.name)}</h4>
    <div class="row2">
      <label>${ui('customFee')}<input id="sOv" type="number" min="0" value="${Number(s.monthly_fee) > 0 ? Number(s.monthly_fee) : ''}"></label>
      <label>${ui('concPct')}<input id="sCo" type="number" min="0" max="100" value="${Number(s.fee_concession_pct || 0)}"></label>
      <button class="btn b-green" data-act="sSave" data-id="${s.id}">💾 ${ui('save')}</button>
    </div>`;
}

function closeApp() {
  if (!confirm('سافٹ ویئر بند کریں؟ / Close software?')) return;
  sb.auth.signOut();
  $('closed').innerHTML = `<div>${ui('closedMsg')}</div>`;
  $('closed').hidden = false;
  try { window.close(); } catch (e) {}
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-act],[data-dst]');
  if (!t) return;
  if (t.dataset.tab) return showTab(t.dataset.tab);
  if (t.dataset.dst) {
    state.defFilter = t.dataset.dst;
    store.set('deffilter', state.defFilter);
    return renderDef();
  }
  if (t.dataset.k) {
    state.payMode = t.dataset.k;
    return refreshPayList();
  }
  const a = t.dataset.act;
  const id = Number(t.dataset.id);
  const s = state.students.find(x => x.id === id);
  switch (a) {
    case 'qFind': {
      const f = findByAdm($('qAdm').value);
      if (!f) return toast(plain('noMatch'), true);
      state.qSel = f; renderPayPanel(); break;
    }
    case 'pay': await payNow(); break;
    case 'pd': if (s) await paymentDetail(s); break;
    case 'pdPrint': if (s) printPaymentDetail(s); break;
    case 'editPay': openPayEdit(id, t.dataset.amt); break;
    case 'savePay': savePay(id); break;
    case 'editBill': if (s) openBillEdit(s); break;
    case 'saveBill': saveBill(Number(t.dataset.vid)); break;
    case 'rPrint': {
      const r = state.rcpt, rs = r && state.students.find(x => x.id === r.sid);
      if (rs) printDoc(receiptHTML(r, rs, state.bl), 'A4', 'portrait');
      break;
    }
    case 'rWa': case 'rSms': {
      const r = state.rcpt, rs = r && state.students.find(x => x.id === r.sid);
      if (!rs) break;
      const txt = rcptText(rs, r.amount, r.receipt, owedOf(rs.id), Number(rs.credit || 0), state.ml);
      a === 'rWa' ? sendWa(rs, txt) : sendSms(rs, txt);
      break;
    }
    case 'rePrint': rePrintPayment(id); break;
    case 'pWa': case 'pSms': {
      const p = state.payList.find(x => x.id === id);
      const ps = p && state.students.find(x => x.id === p.student_id);
      if (!ps) break;
      const txt = rcptText(ps, p.amount, p.receipt_no, owedOf(ps.id), Number(ps.credit || 0), state.ml);
      a === 'pWa' ? sendWa(ps, txt) : sendSms(ps, txt);
      break;
    }
    case 'plPrint': printPayList(); break;
    case 'plSendAll': sendAllPayList(); break;
    case 'qNext': qNext(); break;
    case 'prB': if (s) printBills([billFor(s)].filter(Boolean)); break;
    case 'imgB': if (s) shareImage(billFor(s)); break;
    case 'waB': {
      const b = s && billFor(s);
      if (!b) return toast(plain('noVoucher'), true);
      sendWa(s, billText(b, state.ml));
      break;
    }
    case 'bAll': printBills(filt().map(billFor).filter(Boolean)); break;
    case 'bSel': printBills([...state.checked].map(x => state.students.find(y => y.id === x)).filter(Boolean).map(billFor).filter(Boolean)); break;
    case 'noteOpen': openNote(); break;
    case 'saveNote': saveNote(); break;
    case 'remOpen': openReminder(); break;
    case 'saveRem': store.set('remTplCustom', $('rTpl').value); toast('✅ ' + plain('save')); $('modal').hidden = true; break;
    case 'rApply': state.defMin = $('rMin').value; state.defMax = $('rMax').value; renderDef(); break;
    case 'dPrint': printDefaulters(); break;
    case 'dWa': if (s) sendWa(s, remText(s)); break;
    case 'dSms': if (s) sendSms(s, remText(s)); break;
    case 'dCall':
      if (s) openM(`📞 ${s.name}`, `<div class="row2">
        <button class="btn b-wa" data-act="cWa" data-id="${s.id}">📱 ${plain('wa')} ${plain('call')}</button>
        <button class="btn b-call" data-act="cSim" data-id="${s.id}">📞 SIM ${plain('call')}</button></div>`);
      break;
    case 'cWa': if (s) callWa(s); break;
    case 'cSim': if (s) callSim(s); break;
    case 'reportOpen': openReport(); break;
    case 'runReport': runReport(); break;
    case 'printReport': if (state.lastReport) printDoc(state.lastReport, paper().size, paper().orient); break;
    case 'eSave': {
      const cat = $('eCat').value.trim(), amt = Number($('eAmt').value || 0), note = $('eNote').value.trim();
      if (!cat || !(amt > 0)) return toast('قسم اور رقم لکھیں', true);
      const { error } = await sb.from('expenses').insert({ category: cat, amount: amt, note: note || null });
      if (error) return toast('ناکام: ' + error.message, true);
      $('eCat').value = ''; $('eAmt').value = ''; $('eNote').value = '';
      toast('✅ ' + plain('save')); renderExp();
      break;
    }
    case 'eDel': {
      if (!confirm(plain('del') + '?')) return;
      const { error } = await sb.from('expenses').delete().eq('id', id);
      if (error) return toast('ناکام: ' + error.message, true);
      renderExp();
      break;
    }
    case 'saveCls': {
      const v = Number($('cf' + id).value || 0);
      const { error } = await sb.from('classes').update({ base_fee: v }).eq('id', id);
      if (error) return toast('ناکام: ' + error.message, true);
      toast('✅ ' + plain('save')); loadAll();
      break;
    }
    case 'sPick': state.setSel = s; renderSetEd(); break;
    case 'sSave': {
      const ov = Number($('sOv').value || 0), co = Number($('sCo').value || 0);
      const { error } = await sb.from('students').update({ monthly_fee: ov > 0 ? ov : 0, fee_concession_pct: co }).eq('id', id);
      if (error) return toast('ناکام: ' + error.message, true);
      toast('✅ ' + plain('save')); loadAll();
      break;
    }
  }
});
document.addEventListener('change', e => {
  const c = e.target;
  if (c.dataset.chk) {
    const id = Number(c.dataset.chk);
    c.checked ? state.checked.add(id) : state.checked.delete(id);
    return;
  }
  if (c.id === 'pY' || c.id === 'pM' || c.id === 'pC') return renderAll();
  if (c.id === 'mlang') { state.ml = c.value; store.set('mlang', c.value); }
  if (c.id === 'blang') { state.bl = c.value; store.set('blang', c.value); renderAll(); }
  if (c.id === 'uilang') { state.uiLang = c.value; store.set('uilang', c.value); renderAll(); }
  if (c.id === 'dueMode') renderBills();
});
$('qAdm').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const f = findByAdm($('qAdm').value);
  if (!f) return toast(plain('noMatch'), true);
  state.qSel = f;
  renderPayPanel();
  const amt = document.getElementById('pAmt');
  if (amt) amt.focus();
});
$('pFrom').addEventListener('change', () => { if (state.payMode === 'range') refreshPayList(); });
$('pTo').addEventListener('change', () => { if (state.payMode === 'range') refreshPayList(); });
$('sQ').addEventListener('input', renderSetSearch);
$('bQ').addEventListener('input', renderBills);
$('rMin').addEventListener('input', e => state.defMin = e.target.value);
$('rMax').addEventListener('input', e => state.defMax = e.target.value);
$('backBtn').onclick = goBack;
$('closeBtn').onclick = closeApp;
$('lBtn').onclick = async () => {
  $('lMsg').textContent = '';
  const phone = normalizePK($('lPhone').value.trim());
  if (!isValidMobile(phone)) return $('lMsg').textContent = 'موبائل نمبر درست نہیں';
  const { error } = await sb.auth.signInWithPassword({ email: phone + DOMAIN, password: $('lPass').value });
  if (error) $('lMsg').textContent = 'موبائل نمبر یا پاس ورڈ غلط ہے';
};
$('logout').onclick = () => sb.auth.signOut();

function handleSession(session) {
  if (!session) {
    state.user = null; state.inited = false;
    $('login').hidden = false; $('app').hidden = true;
    return;
  }
  state.user = session.user;
  $('login').hidden = true; $('app').hidden = false;
  $('who').textContent = '👤 ' + (session.user.email || '').replace(DOMAIN, '');
  if (!state.inited) { state.inited = true; initPeriod(); loadAll(); refreshPayList(); }
}
(async () => {
  applyUi();
  const { data } = await sb.auth.getSession();
  handleSession(data.session);
  sb.auth.onAuthStateChange((_e, session) => handleSession(session));
  showTab('gen', false);
})();
</script>
