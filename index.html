<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Suffah Attendance System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#0d6efd; --green:#198754; --teal:#0dcaf0; --orange:#fd7e14;
  --purple:#6f42c1; --red:#dc3545; --yellow:#ffc107; --pink:#d63384;
  --bg:#f0f4ff; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);margin:0;padding:12px;color:var(--text)}
h2{margin:0;font-size:20px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
header{background:linear-gradient(90deg,#6f42c1,#0d6efd,#0dcaf0);color:#fff;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
header .user{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:bold;color:#374151}
input,select{padding:9px;border:2px solid #d1d5db;border-radius:8px;font-size:14px;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
<!-- GitHub Auto Update Test -->  
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:none;color:#fff;background:#6c757d;padding:9px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold;transition:transform .1s,opacity .2s}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.primary{background:var(--blue)}
.btn.success{background:var(--green)}
.btn.wa{background:#25D366}
.btn.sms{background:var(--teal);color:#000}
.btn.copy{background:var(--orange)}
.btn.file{background:#475569}
.btn.purple{background:var(--purple)}
.btn.pink{background:var(--pink)}
.btn.yellow{background:var(--yellow);color:#000}
.btn.dark{background:#374151}
.btn.del{background:var(--red)}
.btn.ghost{background:rgba(255,255,255,.2);border:1px solid #fff;color:#fff}
.btn.edit{background:#f59e0b;color:#000}
.btn.teal{background:#0f766e}
.summary{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;align-items:center}
.chip{padding:6px 12px;border-radius:20px;font-weight:bold;background:#e5e7eb}
.chip.total{background:#e0e7ff;color:#3730a3}
.chip.P{background:#d1fae5;color:#065f46}
.chip.A{background:#fee2e2;color:#991b1b}
.chip.L{background:#fef3c7;color:#92400e}
.chip.T{background:#ffedd5;color:#9a3412}
.chip.pct{background:#ede9fe;color:#5b21b6}
.bar{flex:1;min-width:160px;height:14px;background:#e5e7eb;border-radius:10px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399);transition:width .4s}
.table-wrap{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
th,td{border:1px solid #e5e7eb;padding:7px;text-align:center}
th{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;position:sticky;top:0}
tr:nth-child(even) td{background:#fafafa}
.status{border:none;padding:7px 10px;border-radius:8px;cursor:pointer;font-weight:bold;min-width:120px;transition:transform .1s}
.status:active{transform:scale(.95)}
.status.P{background:#d1fae5;color:#065f46}
.status.A{background:#fee2e2;color:#991b1b}
.status.L{background:#fef3c7;color:#92400e}
.status.T{background:#ffedd5;color:#9a3412}
.nowrap{white-space:nowrap}
.empty{padding:20px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;margin:-12px;background:linear-gradient(135deg,#6f42c1,#0d6efd,#0dcaf0)}
.login-card{width:min(360px,92vw);display:grid;gap:12px}
.login-card h2{color:#4f46e5}
.msg{color:var(--red);font-size:13px;margin:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:10px;z-index:50}
.modal-box{background:#fff;border-radius:14px;padding:18px;width:min(780px,100%);max-height:90vh;overflow:auto}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.form{display:grid;gap:10px}
select.lang{background:#fff;color:#1f2937;padding:6px;font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.3s;z-index:60;font-weight:bold}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
@media print{
  .btn,.hint,.toolbar,.actions,header,#toast,.bar{display:none!important}
  th:nth-child(6),td:nth-child(6),th:nth-child(7),td:nth-child(7),th:nth-child(8),td:nth-child(8){display:none}
  body{background:#fff}
  body.print-modal #app{display:none!important}
  body.print-modal #modal{position:static;background:none}
  body.print-modal .modal-box{box-shadow:none;max-height:none;overflow:visible}
}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="card login-card">
    <h2 style="text-align:center" data-i18n="loginTitle">Al Suffah High School<br>Attendance System</h2>
    <input id="loginPhone" type="tel" data-i18n-ph="phonePh" placeholder="Mobile number (e.g. 03001234567)" autocomplete="username">
    <input id="loginPass" type="password" data-i18n-ph="passPh" placeholder="Password" autocomplete="current-password">
    <button class="btn primary" id="loginBtn" data-i18n="login">🔐 Login</button>
    <p id="loginMsg" class="msg"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <h2 data-i18n="appTitle">🏫 Al Suffah – Attendance</h2>
    <div class="user">
      <span id="userPhone"></span>
      <select id="langPick" class="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="ur">اردو</option>
      </select>
      <button class="btn ghost" id="logoutBtn" data-i18n="logout">Logout</button>
    </div>
  </header>

  <section class="card toolbar">
    <label><span data-i18n="date">📅 Date</span> <input type="date" id="datePick"></label>
    <label><span data-i18n="classLbl">🎓 Class</span> <select id="classPick"></select></label>
    <label><span data-i18n="search">🔍 Search</span> <input id="search" data-i18n-ph="searchPh" placeholder="Name or admission no."></label>
    <button class="btn primary" id="addBtn" data-i18n="addStudent">➕ Add student</button>
    <button class="btn success" id="markAllBtn" data-i18n="markAll">✅ Mark all present</button>
  </section>

  <section class="card summary" id="summary"></section>

  <section class="card actions">
    <label><span data-i18n="msgLang">پیغام کی زبان:</span>
      <select id="msgLangPick" class="lang">
        <option value="ur">اردو</option>
        <option value="en">English</option>
      </select>
    </label>
    <button class="btn wa" id="sendAbsentBtn" data-i18n="sendAbsent">📩 Message parents of absent students</button>
    <button class="btn pink" id="showAbsentBtn" data-i18n="showAbsent">🚫 Absent students</button>
    <button class="btn purple" id="dailyBtn" data-i18n="daily">📊 Daily report</button>
    <button class="btn purple" id="weeklyBtn" data-i18n="weekly">📈 Weekly report</button>
    <button class="btn purple" id="monthlyBtn" data-i18n="monthly">📉 Monthly report</button>
    <button class="btn yellow" id="csvBtn" data-i18n="csv">📥 Export CSV</button>
    <button class="btn dark" id="printBtn" data-i18n="print">🖨️ Print / PDF</button>
    <button class="btn" id="refreshBtn" data-i18n="refresh">🔄 Refresh</button>
    <button class="btn teal" id="backupBtn" data-i18n="backup">💾 Backup</button>
    <button class="btn teal" id="restoreBtn" data-i18n="restore">📤 Restore backup</button>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
    <input type="file" id="fileInput" hidden>
    <button class="btn del" id="resetDayBtn" data-i18n="reset">♻️ Reset this day</button>
  </section>

  <div class="card table-wrap">
    <table>
      <thead>
        <tr>
          <th data-i18n="colNo">#</th>
          <th data-i18n="colName">Name</th>
          <th data-i18n="colAdm">Admission No</th>
          <th data-i18n="colMobile">Mobile</th>
          <th data-i18n="colStatus">Status</th>
          <th data-i18n="colMsg">Message</th>
          <th data-i18n="colEdit">Edit</th>
          <th data-i18n="colDel">Delete</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p class="hint" data-i18n="hint">Click the status button: P (Present) → A (Absent) → L (Leave) → T (Late). Every change is saved immediately.</p>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3 id="modalTitle" style="margin-top:0"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions"><button class="btn dark" id="modalClose" data-i18n="close">Close</button></div>
  </div>
</div>

<div id="toast"></div>

let lang = localStorage.getItem('lang') || 'en';
const t = (k, ...a) => {
  const v = (I18N[lang] && I18N[lang][k]) ?? I18N.en[k] ?? k;
  return typeof v === 'function' ? v(...a) : v;
};

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const txt = t(el.dataset.i18n);
    if (typeof txt === 'string') el.textContent = txt;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $('langPick').value = lang;
  $('msgLangPick').value = state.msgLang;
  renderSummary();
  render();
}

/* ===== 3. Helpers ===== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => fmt(new Date());
const addDays = (s, n) => { const [y,m,d] = s.split('-').map(Number); return fmt(new Date(y, m-1, d+n)); };
const prettyDate = s => { const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NEXT = {P:'A', A:'L', L:'T', T:'P'};
const statusLabel = st => t(st === 'P' ? 'statusP' : st === 'A' ? 'statusA' : st === 'L' ? 'statusL' : 'statusT');

function toast(msg, err = false) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.className = '', 3000);
}

// 03001234567 -> 923001234567
function normalizePK(num) {
  let d = String(num).replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '92' + d.slice(1);
  else if (d.length === 10 && d.startsWith('3')) d = '92' + d;
  return d;
}
const isValidMobile = n => /^92\d{10}$/.test(normalizePK(n));

// Parent message in the language selected by the user (default Urdu)
function messageText(name, status, date) {
  if (state.msgLang === 'en') {
    const st = status === 'A' ? 'absent from school today'
             : status === 'T' ? 'late to school today'
             : 'on leave today';
    return `Assalam o Alaikum!\nYour child ${name} was ${st}.\nDate: ${prettyDate(date)}\n\nAl Suffah High School`;
  }
  const line = status === 'T'
    ? 'آج اسکول میں دیر سے پہنچا'
    : `اسکول سے ${status === 'A' ? 'غیر حاضر تھا' : 'چھٹی پر تھا'}`;
  return `السلام علیکم!\nآپ کا بچہ ${name}\nآج مورخہ ${prettyDate(date)}\n${line}\n\nالصفہ ہائی اسکول`;
}

function copyText(text) {
  const ok = () => toast(t('copied'));
  const fail = () => toast(t('copyFail'), true);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(ok).catch(fail);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy') ? ok() : fail(); } catch { fail(); }
    ta.remove();
  }
}

function openModal(title, html) {
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = html;
  $('modal').hidden = false;
}
function closeModal() {
  $('modal').hidden = true;
  $('modalBody').innerHTML = '';
  clearTimeout(cooldownTimer);
}
$('modalClose').onclick = closeModal;
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function downloadBlob(filename, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function downloadCSV(filename, header, rows) {
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [header, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
  downloadBlob(filename, new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' }));
}

// Reads every row of a table (Supabase returns max 1000 per request)
async function fetchAll(table, cols) {
  let out = [], from = 0;
  while (true) {
    const { data, error } = await sb.from(table).select(cols).order('id').range(from, from + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}

async function upsertChunks(table, rows, opts) {
  let out = [];
  for (let i = 0; i < rows.length; i += 500) {
    const { data, error } = await sb.from(table).upsert(rows.slice(i, i + 500), opts).select();
    if (error) throw error;
    out = out.concat(data || []);
  }
  return out;
}

async function insertChunks(table, rows) {
  for (let i = 0; i < rows.length; i += 500) {
    const { error } = await sb.from(table).insert(rows.slice(i, i + 500));
    if (error) throw error;
  }
}

/* ===== 4. State ===== */
const state = {
  user: null, classes: [], students: [], att: new Map(),
  classId: null, date: '', seq: 0, inited: false,

};
let pendingFileStudent = null;

/* ===== 5. Login ===== */
async function boot() {
  const { data } = await sb.auth.getSession();
  handleSession(data.session);
  sb.auth.onAuthStateChange((_event, session) => handleSession(session));
}

function handleSession(session) {
  if (!session) {
    state.user = null; state.inited = false;
    $('loginScreen').hidden = false; $('app').hidden = true;
    return;
  }
  state.user = session.user;
  $('loginScreen').hidden = true; $('app').hidden = false;
  $('userPhone').textContent = '👤 ' + (session.user.email || '').replace(SCHOOL_DOMAIN, '');

}

$('loginBtn').onclick = async () => {

/* ===== 6. Load data ===== */
async function init() {
  state.date = todayStr();
  $('datePick').value = state.date;
  await loadClasses();
  const saved = localStorage.getItem('lastClassId');
  if (saved && [...$('classPick').options].some(o => o.value === saved)) $('classPick').value = saved;
  await loadDay();
}

// Class and date changes reload the student list automatically
$('classPick').onchange = () => loadDay();
$('datePick').onchange = () => loadDay();

async function loadClasses() {
  const { data, error } = await sb.from('classes').select('id,name').order('sort_order');
  if (error) return toast(t('loadFail', error.message), true);
  state.classes = data;
  $('classPick').innerHTML = data.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
}

async function loadDay() {
  if (!state.classes.length) return;
  const seq = ++state.seq;
  state.classId = Number($('classPick').value);
  state.date = $('datePick').value || todayStr();
  localStorage.setItem('lastClassId', state.classId);

  // Only students of the selected class are loaded. select('*') works even if
  // the new columns (father_name, sim_number, address) are not added yet.
  const { data: students, error } = await sb.from('students')
    .select('*')
    .eq('class_id', state.classId).eq('is_active', true).order('name');
  if (seq !== state.seq) return;
  if (error) return toast(t('loadFail', error.message), true);

  state.students = students;
  state.att = new Map();
  const ids = students.map(s => s.id);

  if (ids.length) {
    const { data: rows, error: e2 } = await sb.from('attendance')
      .select('student_id,status').eq('date', state.date).in('student_id', ids);
    if (seq !== state.seq) return;
    if (e2) return toast(t('loadFail', e2.message), true);
    rows.forEach(r => state.att.set(r.student_id, r.status));

    // Students without a record start as P, so reports stay correct
    const missing = ids.filter(id => !state.att.has(id))
      .map(id => ({ student_id: id, date: state.date, status: 'P', updated_by: state.user.id }));
    if (missing.length) {
      const { error: e3 } = await sb.from('attendance')
        .upsert(missing, { onConflict: 'student_id,date', ignoreDuplicates: true });
      if (e3) return toast(t('loadFail', e3.message), true);
      missing.forEach(m => state.att.set(m.student_id, 'P'));
    }
  }
  render();
}

async function saveAtt(items) {
  return sb.from('attendance').upsert(
    items.map(i => ({ student_id: i.student_id, date: state.date, status: i.status, updated_by: state.user.id })),
    { onConflict: 'student_id,date' }
  );
}

/* ===== 7. Render ===== */
function render() {
  const q = $('search').value.trim().toLowerCase();
  const list = state.students.filter(s =>
    !q || s.name.toLowerCase().includes(q) || String(s.admission_no).toLowerCase().includes(q));

  $('tbody').innerHTML = list.length ? list.map((s, i) => {
    const st = state.att.get(s.id) || 'P';
    return `<tr>
      <td>${i + 1}</td>
      <td><b>${esc(s.name)}</b></td>
      <td>${esc(s.admission_no)}</td>
      <td>${esc(s.mobile)}</td>
      <td><button class="status ${st}" data-act="status" data-id="${s.id}">${st} · ${statusLabel(st)}</button></td>
      <td class="nowrap">
        <button class="btn sm wa" data-act="wa" data-id="${s.id}">${t('wa')}</button>
        <button class="btn sm sms" data-act="sms" data-id="${s.id}">${t('sms')}</button>
        <button class="btn sm copy" data-act="copy" data-id="${s.id}">${t('copy')}</button>
        <button class="btn sm file" data-act="file" data-id="${s.id}">${t('file')}</button>
      </td>
      <td><button class="btn sm edit" data-act="edit" data-id="${s.id}">${t('edit')}</button></td>
      <td><button class="btn sm del" data-act="del" data-id="${s.id}">${t('del')}</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="8" class="empty">${t('emptyClass')}</td></tr>`;

  renderSummary();
}

function renderSummary() {
  const c = { P: 0, A: 0, L: 0, T: 0 };
  state.students.forEach(s => c[state.att.get(s.id) || 'P']++);
  const total = state.students.length;
  const pct = total ? Math.round(c.P / total * 100) : 0;
  $('summary').innerHTML = `
    <span class="chip total">👥 ${t('sumTotal')}: ${total}</span>
    <span class="chip P">✅ ${t('sumPresent')}: ${c.P}</span>
    <span class="chip A">❌ ${t('sumAbsent')}: ${c.A}</span>
    <span class="chip L">🌴 ${t('sumLeave')}: ${c.L}</span>
    <span class="chip T">⏰ ${t('sumLate')}: ${c.T}</span>
    <span class="chip pct">📊 ${t('sumPct')}: ${pct}%</span>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <span class="hint">📅 ${prettyDate(state.date)}</span>`;
}

/* ===== 8. Attendance and row buttons ===== */
$('search').addEventListener('input', render);

$('tbody').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = Number(b.dataset.id);
  const s = state.students.find(x => x.id === id);
  if (!s) return;
  const act = b.dataset.act;
  if (act === 'status') setStatus(id, NEXT[state.att.get(id) || 'P']);
  if (act === 'wa') sendMessage(s, 'wa');
  if (act === 'sms') sendMessage(s, 'sms');
  if (act === 'copy') copyText(messageText(s.name, state.att.get(s.id) || 'A', state.date));
  if (act === 'file') { pendingFileStudent = s; $('fileInput').click(); }
  if (act === 'edit') openStudentForm(s);
  if (act === 'del') deleteStudent(s);
});

async function setStatus(id, status) {
  const prev = state.att.get(id);
  state.att.set(id, status);
  render();
  const { error } = await saveAtt([{ student_id: id, status }]);
  if (error) {
    state.att.set(id, prev);
    render();
    toast(t('saveFail', error.message), true);
  }
}

$('markAllBtn').onclick = async () => {
  if (!state.students.length) return toast(t('pickStudentsFirst'), true);
  state.students.forEach(s => state.att.set(s.id, 'P'));
  render();
  const { error } = await saveAtt(state.students.map(s => ({ student_id: s.id, status: 'P' })));
  toast(error ? t('saveFail', error.message) : t('markAllDone'), !!error);
};

$('resetDayBtn').onclick = async () => {
  if (!state.students.length) return;
  if (!confirm(t('resetConfirm', prettyDate(state.date)))) return;
  const ids = state.students.map(s => s.id);
  const { error } = await sb.from('attendance').delete().eq('date', state.date).in('student_id', ids);
  if (error) return toast(t('saveFail', error.message), true);
  toast(t('resetDone'));
  loadDay();
};

function openStudentForm(s = null) {
  const classOpts = state.classes.map(c =>
    `<option value="${c.id}" ${c.id === state.classId ? 'selected' : ''}>${esc(c.name)}</option>`).join('');

  openModal(s ? t('editStudent') : t('newStudent'), `
    <form id="sForm" class="form">
      <label>${t('formClass')}<select name="class_id" required>${classOpts}</select></label>
      <label>${t('formName')}<input name="name" required value="${esc(s?.name || '')}"></label>
      <label>${t('formAdm')}<input name="admission_no" required value="${esc(s?.admission_no || '')}"></label>
      <label>${t('formFather')}<input name="father_name" value="${esc(s?.father_name || '')}"></label>
      <label>${t('formMobile')}<input name="mobile" type="tel" required value="${esc(s?.mobile || '')}"></label>
      <label>${t('formSim')}<input name="sim_number" type="tel" value="${esc(s?.sim_number || '')}"></label>
      <label>${t('formAddress')}<input name="address" value="${esc(s?.address || '')}"></label>
      <div class="modal-actions"><button class="btn success" type="submit">${t('formSave')}</button></div>
    </form>`);

  $('sForm').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = fd.get('name').trim();
    const admission_no = fd.get('admission_no').trim();
    const mobile = fd.get('mobile').trim();
    const sim_number = fd.get('sim_number').trim();
    if (!isValidMobile(mobile)) return toast(t('errPhone'), true);
    if (sim_number && !isValidMobile(sim_number)) return toast(t('errPhone'), true);

    const class_id = Number(fd.get('class_id'));
    const row = {
      name, admission_no, mobile,
      sim_number: sim_number || null,
      father_name: fd.get('father_name').trim() || null,
      address: fd.get('address').trim() || null,

    };
    const res = s
      ? await sb.from('students').update(row).eq('id', s.id)
      : await sb.from('students').insert(row);

    if (res.error) {
      return toast(res.error.code === '23505' ? t('dupAdm') : t('saveFail', res.error.message), true);
    }
    closeModal();
    toast(t('saved'));
    // Show the class the student was saved in
    if (class_id !== state.classId) $('classPick').value = class_id;
    loadDay();
  };
}

async function deleteStudent(s) {
  if (!confirm(t('deleteConfirm', s.name))) return;
  const { error } = await sb.from('students').update({ is_active: false }).eq('id', s.id);
  if (error) return toast(t('saveFail', error.message), true);
  toast(t('deleted'));
  loadDay();
}

/* ===== 10. Messages ===== */
async function logMessage(s, channel) {
  const { error } = await sb.from('message_logs').insert({
    student_id: s.id, date: state.date, channel, sent_by: state.user.id
  });
  if (error) toast(t('logFail'), true);
}

async function sendMessage(s, channel) {
  if (!isValidMobile(s.mobile)) return toast(t('mobileBad', s.name), true);
  const status = state.att.get(s.id) || 'P';

  const text = messageText(s.name, status, state.date);
  const num = normalizePK(s.mobile);
  const url = channel === 'wa'
    ? `https://wa.me/${num}?text=${encodeURIComponent(text)}`
    : `sms:+${num}${/iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?'}body=${encodeURIComponent(text)}`;

  if (channel === 'wa') {
    window.open(url, '_blank');
    logMessage(s, channel);
  } else {
    await logMessage(s, channel);
    location.href = url;
  }
}

// One-by-one queue: one click opens the next chat, with a cooldown between messages
let queueIds = [], queueDone = new Set(), lastWaOpen = 0, cooldownTimer = null;
const COOLDOWN_MS = 10000;

function absentList() {
  return state.students.filter(s => ['A', 'L', 'T'].includes(state.att.get(s.id)));
}

$('sendAbsentBtn').onclick = () => {
  const list = absentList();
  if (!list.length) return toast(t('noAbsent'));
  queueIds = list.map(s => s.id);
  queueDone = new Set();
  lastWaOpen = 0;
  openModal(t('sendTitle', list.length), '');
  renderQueue();
};

function renderQueue() {
  const list = queueIds.map(id => state.students.find(x => x.id === id)).filter(Boolean);
  const next = list.find(s => !queueDone.has(s.id));
  const remaining = lastWaOpen + COOLDOWN_MS - Date.now();

  clearTimeout(cooldownTimer);
  if (next && remaining > 0) cooldownTimer = setTimeout(renderQueue, remaining + 50);

  const label = !next ? t('queueDone')
    : remaining > 0 ? t('queueWait', Math.ceil(remaining / 1000))
    : t('queueNext', next.name);

  $('modalBody').innerHTML = `
    <p class="hint">${t('queueHint')}</p>
    <div class="actions" style="margin:10px 0">
      <button class="btn wa" id="queueNext" ${(!next || remaining > 0) ? 'disabled' : ''}>${label}</button>
    </div>
    <table>
      <tr><th>#</th><th>${t('colName')}</th><th>${t('colMobile')}</th><th>${t('colStatus')}</th><th>✔</th></tr>
      ${list.map((s, i) => `<tr>
        <td>${i + 1}</td>
        <td>${esc(s.name)}</td>
        <td>${esc(s.mobile)}</td>
        <td>${statusLabel(state.att.get(s.id))}</td>
        <td>${queueDone.has(s.id) ? '✅' : ''}</td>
      </tr>`).join('')}
    </table>`;

  const btn = $('queueNext');
  if (btn && next) btn.onclick = () => queueSendNext(next);
}

function queueSendNext(s) {
  if (!isValidMobile(s.mobile)) return toast(t('mobileBad', s.name), true);
  lastWaOpen = Date.now();
  queueDone.add(s.id);
  sendMessage(s, 'wa');
  renderQueue();
}

// File picker for one student, then sent via WhatsApp
$('fileInput').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  const s = pendingFileStudent;
  pendingFileStudent = null;
  if (!file || !s) return;
  if (!isValidMobile(s.mobile)) return toast(t('mobileBad', s.name), true);

  const text = messageText(s.name, state.att.get(s.id) || 'A', state.date);

  // Phones: native share sheet, which can send the file straight to WhatsApp
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], text });
      logMessage(s, 'wa');
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }

  // Laptops: download the file and open the WhatsApp chat; attach the file there
  downloadBlob(file.name, file);
  window.open(`https://wa.me/${normalizePK(s.mobile)}?text=${encodeURIComponent(text)}`, '_blank');
  logMessage(s, 'wa');
  toast(t('fileFallback'));
};

$('showAbsentBtn').onclick = () => {
  const list = absentList();
  openModal(t('absentTitle', list.length), list.length ? `
    <table>
      <tr><th>#</th><th>${t('colName')}</th><th>${t('colAdm')}</th><th>${t('colStatus')}</th></tr>
      ${list.map((s, i) => `<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${esc(s.admission_no)}</td>
        <td>${statusLabel(state.att.get(s.id))}</td></tr>`).join('')}
    </table>` : `<p>${t('noAbsent')}</p>`);
};

/* ===== 11. Reports ===== */
async function fetchRange(start, end) {
  const ids = state.students.map(s => s.id);
  let out = [], from = 0;
  if (!ids.length) return out;
  while (true) {
    const { data, error } = await sb.from('attendance')
      .select('student_id,date,status')
      .in('student_id', ids).gte('date', start).lte('date', end)
      .order('id').range(from, from + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}

async function openReport(kind) {
  if (!state.students.length) return toast(t('pickClassFirst'), true);
  const end = state.date;
  let start = end, title = t('reportDaily');
  if (kind === 'weekly') { start = addDays(end, -6); title = t('reportWeekly'); }
  if (kind === 'monthly') { start = addDays(end, -29); title = t('reportMonthly'); }

  try {
    const rows = await fetchRange(start, end);
    const stats = new Map(state.students.map(s => [s.id, { name: s.name, adm: s.admission_no, P: 0, A: 0, L: 0, T: 0 }]));
    rows.forEach(r => { const st = stats.get(r.student_id); if (st) st[r.status]++; });

    const data = [...stats.values()].map(x => {
      const total = x.P + x.A + x.L + x.T;
      return { ...x, total, pct: total ? Math.round(x.P / total * 100) : 0 };
    });
    const heading = `${title} (${prettyDate(start)} – ${prettyDate(end)})`;

    openModal(heading, `
      <div class="actions" style="margin-bottom:10px">
        <button class="btn primary" id="repPrint">${t('reportPrint')}</button>
        <button class="btn yellow" id="repCsv">${t('reportCsv')}</button>
      </div>
      <table>
        <tr><th>#</th><th>${t('colName')}</th><th>${t('colAdm')}</th><th>${t('colPresent')}</th><th>${t('colAbsent')}</th><th>${t('colLeave')}</th><th>${t('colLate')}</th><th>${t('colRecords')}</th><th>${t('colPct')}</th></tr>
        ${data.map((x, i) => `<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.adm)}</td>
          <td>${x.P}</td><td>${x.A}</td><td>${x.L}</td><td>${x.T}</td><td>${x.total}</td><td>${x.pct}%</td></tr>`).join('')}
      </table>`);

    $('repPrint').onclick = printModal;
    $('repCsv').onclick = () => downloadCSV(
      `report_${start}_${end}.csv`,
      [t('colName'), t('colAdm'), t('colPresent'), t('colAbsent'), t('colLeave'), t('colLate'), t('colRecords'), t('colPct')],
      data.map(x => [x.name, x.adm, x.P, x.A, x.L, x.T, x.total, x.pct + '%'])
    );
  } catch (err) {
    toast(t('reportFail', err.message), true);
  }
}

function printModal() {
  document.body.classList.add('print-modal');
  window.print();
}
window.addEventListener('afterprint', () => document.body.classList.remove('print-modal'));

$('dailyBtn').onclick = () => openReport('daily');
$('weeklyBtn').onclick = () => openReport('weekly');
$('monthlyBtn').onclick = () => openReport('monthly');

/* ===== 12. CSV and print ===== */
$('csvBtn').onclick = () => {
  if (!state.students.length) return toast(t('csvEmpty'), true);
  downloadCSV(
    `attendance_${state.date}.csv`,
    [t('colName'), t('colAdm'), t('colMobile'), t('colStatus')],
    state.students.map(s => [s.name, s.admission_no, s.mobile, statusLabel(state.att.get(s.id) || 'P')])
  );
};
$('printBtn').onclick = () => window.print();

/* ===== 13. Refresh ===== */
$('refreshBtn').onclick = async () => {
  toast(t('working'));
  await loadClasses();
  await loadDay();
  toast(t('refreshed'));
};

/* ===== 14. Backup and restore ===== */
// Backup: downloads every table as a JSON file
$('backupBtn').onclick = async () => {
  try {
    toast(t('working'));
    const [classes, students, attendance, message_logs] = await Promise.all([
      fetchAll('classes', 'id,name,sort_order'),
      fetchAll('students', 'id,name,admission_no,mobile,father_name,sim_number,address,class_id,is_active'),
      fetchAll('attendance', 'id,student_id,date,status'),
      fetchAll('message_logs', 'id,student_id,date,channel')
    ]);
    const payload = {
      version: 1,
      created_at: new Date().toISOString(),
      classes, students, attendance, message_logs
    };
    downloadBlob(`backup_${todayStr()}.json`,
      new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
    toast(t('backupDone'));
  } catch (err) {
    toast(t('loadFail', err.message), true);
  }
};

// Restore: reads a backup file and writes it back to the database
$('restoreBtn').onclick = () => $('restoreFile').click();

$('restoreFile').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (!confirm(t('restoreConfirm'))) return;
  try {
    toast(t('working'));
    const payload = JSON.parse(await file.text());
    await restoreData(payload);
    toast(t('restored'));
    await loadClasses();
    await loadDay();
  } catch (err) {
    toast(t('restoreFail', err.message), true);
  }
};

// IDs are generated by the database, so records are matched by name / admission no.
async function restoreData(p) {
  if (!p || !Array.isArray(p.classes) || !Array.isArray(p.students)) throw new Error(t('badBackup'));

  // 1. Classes (matched by name)
  const savedClasses = await upsertChunks('classes',
    p.classes.map(c => ({ name: c.name, sort_order: c.sort_order ?? 0 })),
    { onConflict: 'name' });
  const classByName = new Map(savedClasses.map(c => [c.name, c.id]));
  const oldClassToNew = new Map(p.classes.map(c => [c.id, classByName.get(c.name)]));

  // 2. Students (matched by admission no)
  const savedStudents = await upsertChunks('students',
    p.students.map(s => ({
      name: s.name,
      admission_no: String(s.admission_no),
      mobile: String(s.mobile),
      sim_number: s.sim_number ?? null,
      father_name: s.father_name ?? null,
      address: s.address ?? null,
      class_id: oldClassToNew.get(s.class_id) ?? null,
      is_active: s.is_active !== false
    })),
    { onConflict: 'admission_no' });
  const studentByAdm = new Map(savedStudents.map(s => [String(s.admission_no), s.id]));
  const oldStudentToNew = new Map(p.students.map(s => [s.id, studentByAdm.get(String(s.admission_no))]));

  // 3. Attendance (matched by student + date)
  const attRows = (p.attendance || [])
    .map(a => ({
      student_id: oldStudentToNew.get(a.student_id),
      date: a.date,
      status: a.status,
      updated_by: null
    }))
    .filter(r => r.student_id);
  await upsertChunks('attendance', attRows, { onConflict: 'student_id,date' });

  // 4. Message log (added again; restoring the same file twice adds duplicate log rows)
  const logRows = (p.message_logs || [])
    .map(m => ({
      student_id: oldStudentToNew.get(m.student_id),
      date: m.date,
      channel: m.channel,
      sent_by: null
    }))
    .filter(r => r.student_id);
  if (logRows.length) await insertChunks('message_logs', logRows);
}

/* ===== 15. Start ===== */
applyLang();
boot();
</script>
