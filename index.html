<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL SUFFAH PUBLIC HIGH SCHOOL – Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#0d6efd;--green:#198754;--teal:#0dcaf0;--purple:#6f42c1;--red:#dc3545;--pink:#d63384;--bg:#f0f4ff;--text:#111827;--muted:#374151}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);margin:0;padding:12px;color:var(--text)}
.ur{font-family:'Noto Nastaliq Urdu',serif;line-height:1.9}
.school{font-size:20px;font-weight:900;letter-spacing:1px;text-align:center;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35);margin-bottom:6px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
header{background:linear-gradient(90deg,#4c1d95,#1d4ed8,#0891b2);border-radius:12px;padding:14px;margin-bottom:12px}
.user{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px;color:#fff}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:bold;color:#111}
input,select,textarea{padding:9px;border:2px solid #9ca3af;border-radius:8px;font-size:15px;background:#fff;color:#111;max-width:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:none;color:#fff;background:#6c757d;padding:9px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.25);text-decoration:none;display:inline-block}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.b-blue{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.b-green{background:linear-gradient(135deg,#22c55e,#15803d)}
.b-wa{background:linear-gradient(135deg,#25d366,#128c7e)}
.b-sms{background:linear-gradient(135deg,#06b6d4,#0e7490)}
.b-call{background:linear-gradient(135deg,#6366f1,#4338ca)}
.b-purple{background:linear-gradient(135deg,#a855f7,#6d28d9)}
.b-pink{background:linear-gradient(135deg,#ec4899,#be185d)}
.b-orange{background:linear-gradient(135deg,#f97316,#c2410c)}
.b-red{background:linear-gradient(135deg,#ef4444,#991b1b)}
.b-dark{background:linear-gradient(135deg,#475569,#1e293b)}
.b-teal{background:linear-gradient(135deg,#14b8a6,#0f766e)}
.b-indigo{background:linear-gradient(135deg,#818cf8,#4338ca)}
.b-gold{background:linear-gradient(135deg,#f59e0b,#b45309)}
.b-yellow{background:linear-gradient(135deg,#facc15,#ca8a04);color:#000}
.b-fee{background:linear-gradient(135deg,#f59e0b,#b45309)}
.b-form{background:linear-gradient(135deg,#14b8a6,#0f766e)}
.summary{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;align-items:center}
.chip{padding:6px 12px;border-radius:20px;font-weight:bold;background:#e5e7eb;color:#111}
.chip.total{background:#e0e7ff;color:#3730a3}
.chip.P{background:#d1fae5;color:#065f46}
.chip.A{background:#fee2e2;color:#991b1b}
.chip.L{background:#fef3c7;color:#92400e}
.chip.T{background:#ffedd5;color:#9a3412}
.chip.pct{background:#ede9fe;color:#5b21b6}
.bar{flex:1;min-width:160px;height:14px;background:#e5e7eb;border-radius:10px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px;color:#111}
th,td{border:1px solid #d1d5db;padding:7px;text-align:center;color:#111}
th{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff}
.status{border:none;padding:7px 10px;border-radius:8px;cursor:pointer;font-weight:bold;min-width:120px}
.status.P{background:#d1fae5;color:#065f46}
.status.A{background:#fee2e2;color:#991b1b}
.status.L{background:#fef3c7;color:#92400e}
.status.T{background:#ffedd5;color:#9a3412}
.nowrap{white-space:nowrap}
.empty{padding:20px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.warn{color:#dc2626;font-weight:bold}
.alert{background:#fef2f2;border:2px solid #f87171;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:linear-gradient(135deg,#fff,#eef2ff);border-radius:14px;padding:12px;text-align:center;box-shadow:0 6px 14px rgba(79,70,229,.15);cursor:pointer}
.kpi b{display:block;font-size:24px;color:#3730a3}
.kpi span{font-size:12px;color:var(--muted)}
.cam{background:#000;border-radius:12px;overflow:hidden;margin:10px 0}
.cam video{width:100%;display:block;transform:scaleX(-1)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;margin:-12px;background:linear-gradient(135deg,#6f42c1,#0d6efd,#0dcaf0)}
.lc{width:min(360px,92vw);display:grid;gap:12px;background:#fff;border-radius:14px;padding:18px}
.msg{color:#dc2626;font-size:13px;margin:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:10px;z-index:50}
.mbox{background:#fff;border-radius:14px;padding:18px;width:min(900px,100%);max-height:90vh;overflow:auto}
.ma{display:flex;justify-content:flex-end;margin-top:12px;gap:8px;flex-wrap:wrap}
.form{display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.sec{font-weight:bold;color:#4c1d95;border-bottom:2px solid #c4b5fd;padding-bottom:3px;margin-top:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.3s;z-index:60;font-weight:bold;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
@media print{
  .noprint,.hint,.toolbar,.actions,header,#toast,.kpis,.alert{display:none!important}
  body{background:#fff}
  body.print-modal #app{display:none!important}
  body.print-modal #modal{position:static;background:none}
  body.print-modal .mbox{box-shadow:none;max-height:none;overflow:visible}
}
#tbody .btn.call{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
#tbody .btn.wa{background:linear-gradient(135deg,#25d366,#128c7e)}
#tbody .btn.sms{background:linear-gradient(135deg,#06b6d4,#0e7490)}
#tbody .btn.copy{background:linear-gradient(135deg,#f97316,#c2410c)}
#tbody .btn.file{background:linear-gradient(135deg,#64748b,#334155)}
#tbody .btn.face{background:linear-gradient(135deg,#a855f7,#6d28d9)}
#tbody .btn.purple{background:linear-gradient(135deg,#ec4899,#be185d)}
#tbody .btn.form{background:linear-gradient(135deg,#14b8a6,#0f766e)}
#tbody .btn.edit{background:linear-gradient(135deg,#facc15,#ca8a04);color:#000}
#tbody .btn.del{background:linear-gradient(135deg,#ef4444,#991b1b)}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="card lc">
    <div class="school" style="color:#4c1d95;text-shadow:none">AL SUFFAH PUBLIC HIGH SCHOOL</div>
    <input id="loginPhone" type="tel" placeholder="Mobile number (e.g. 03001234567)" autocomplete="username">
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn b-blue" id="loginBtn">🔐 Login</button>
    <p id="loginMsg" class="msg"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="school">🏫 AL SUFFAH PUBLIC HIGH SCHOOL</div>
    <div class="user">
      <span id="userPhone"></span>
      <select id="langPick">
        <option value="en">English</option>
        <option value="ur">اردو</option>
      </select>
      <button class="btn b-red" id="logoutBtn">Logout</button>
    </div>
  </header>

  <div id="alertBox"></div>
  <section class="kpis" id="kpis"></section>

  <section class="card toolbar">
    <label>📅 Date <input type="date" id="datePick"></label>
    <label>🎓 Class <select id="classPick"></select></label>
    <label>🔍 Search <input id="search" placeholder="Name or admission no."></label>
    <button class="btn b-blue" id="addBtn">➕ Add student</button>
    <button class="btn b-green" id="markAllBtn">✅ Mark all present</button>
    <button class="btn b-purple" id="faceCheckBtn">📷 Face check-in</button>
  </section>

  <section class="card summary" id="summary"></section>

  <section class="card actions">
    <label>Parent message language:
      <select id="msgLangPick">
        <option value="ur">اردو</option>
        <option value="en">English</option>
      </select>
    </label>
    <button class="btn b-wa" id="sendAbsentBtn">📩 Message parents of absent students</button>
    <button class="btn b-pink" id="showAbsentBtn">🚫 Absent students</button>
    <button class="btn b-purple" id="dailyBtn">📊 Daily report</button>
    <button class="btn b-purple" id="weeklyBtn">📈 Weekly report</button>
    <button class="btn b-purple" id="monthlyBtn">📉 Monthly report</button>
    <button class="btn b-yellow" id="csvBtn">📥 Export CSV</button>
    <button class="btn b-dark" id="printBtn">🖨️ Print / PDF</button>
    <a class="btn b-fee" href="fees.html">💰 فیس سسٹم / Fees</a>
    <button class="btn b-blue" id="refreshBtn">🔄 Refresh</button>
    <button class="btn b-teal" id="backupBtn">💾 Backup</button>
    <button class="btn b-orange" id="restoreBtn">📤 Restore backup</button>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
    <input type="file" id="fileInput" hidden>
    <button class="btn b-red" id="resetDayBtn">♻️ Reset this day</button>
  </section>

  <div class="card tw">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Name</th><th>Admission No</th><th>Status</th><th>Mobile</th>
          <th>Actions</th><th>Edit</th><th>Delete</th><th>💰 Due</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p class="hint">Click the status button: P (Present) → A (Absent) → L (Leave) → T (Late). Every change is saved immediately.</p>
</div>

<div id="modal" class="modal" hidden>
  <div class="mbox">
    <h3 id="modalTitle" style="margin-top:0"></h3>
    <div id="modalBody"></div>
    <div class="ma"><button class="btn b-dark" id="modalClose">Close</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://mjwnyvaofwyhrhkrmifz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sXLOkuE5Bzpdx2HNQnzQ-Q_PFeiaVW4';
const DOMAIN = '@suffah.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SCHOOL_LAT = 31.7361310, SCHOOL_LNG = 70.3336737, SCHOOL_RADIUS_M = 150;
const FACE_LIB = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js';
const FACE_MODELS = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model';
const FACE_THRESHOLD = 0.5;
const ALERT_DAYS = [3, 5, 7];
const COOLDOWN_MS = 10000;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => fmt(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return fmt(new Date(y, m - 1, d + n)); };
const prettyDate = s => { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const admNum = s => { const n = parseInt(String(s.admission_no).replace(/\D/g, ''), 10); return isNaN(n) ? Infinity : n; };
const byAdm = (a, b) => (admNum(a) - admNum(b)) || String(a.admission_no).localeCompare(String(b.admission_no));
const normalizePK = num => {
  let d = String(num ?? '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '92' + d.slice(1);
  else if (d.length === 10 && d.startsWith('3')) d = '92' + d;
  return d;
};
const isValidMobile = n => /^92\d{10}$/.test(normalizePK(n));
const smsNum = s => isValidMobile(s.sim_number || '') ? s.sim_number : s.mobile;
const sectionName = sec => (sec === 'Green' || sec === 'Yellow') ? sec : '';

// ترجمہ: [English, Urdu]
const TX = {
  login: ['🔐 Login', '🔐 لاگ اِن'],
  logout: ['Logout', 'لاگ آؤٹ'],
  allClasses: ['All classes', 'تمام کلاسیں'],
  noStudents: ['No students here. Click "Add student".', 'یہاں کوئی طالب علم نہیں۔'],
  statusP: ['Present', 'حاضر'], statusA: ['Absent', 'غیر حاضر'], statusL: ['Leave', 'چھٹی'], statusT: ['Late', 'لیٹ'],
  saved: ['💾 Saved', '💾 محفوظ ہو گیا'],
  deleted: ['🗑️ Removed from the list', '🗑️ فہرست سے نکال دیا گیا'],
  copied: ['📋 Message copied', '📋 پیغام کاپی ہو گیا'],
  working: ['⏳ Please wait...', '⏳ براہ کرم انتظار کریں...'],
  refreshed: ['🔄 Refreshed', '🔄 ریفریش ہو گیا'],
  backupDone: ['💾 Backup downloaded', '💾 بیک اپ ڈاؤن لوڈ ہو گیا'],
  restored: ['✅ Data restored', '✅ ڈیٹا بحال ہو گیا'],
  dupAdm: ['This admission number already exists', 'یہ ایڈمیشن نمبر پہلے سے موجود ہے'],
  errPhone: ['Invalid mobile number (e.g. 03001234567)', 'موبائل نمبر درست نہیں'],
  errLogin: ['Wrong mobile number or password', 'موبائل نمبر یا پاس ورڈ غلط ہے'],
  noNumber: ['No valid number for this student', 'درست نمبر موجود نہیں'],
  noAbsent: ['No absent students today.', 'آج کوئی غیر حاضر طالب علم نہیں۔'],
  faceNone: ['No single face found. Try again.', 'ایک واضح چہرہ نہیں ملا'],
  fileFallback: ['File downloaded. Attach it in the WhatsApp chat.', 'فائل ڈاؤن لوڈ ہو گئی، واٹس ایپ میں منسلک کریں۔']
};
let lang = store.get('lang') || 'en';
const t = k => (TX[k] ? TX[k][lang === 'ur' ? 1 : 0] : k);

function toast(msg, err = false) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.className = '', 3000);
}

const state = {
  user: null, inited: false, classes: [], students: [], att: new Map(),
  classId: 'all', date: '', seq: 0, msgLang: store.get('msgLang') || 'ur',
  alerts: [], feeMap: {}, setSel: null, queue: [], queueDone: new Set(), lastWa: 0, cooldown: null
};
let faceStop = null, pendingFile = null, repRows = [], repKind = 'weekly', repStart = '', repEnd = '';

function openModal(title, html) {
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = html;
  $('modal').hidden = false;
}
function closeModal() {
  if (faceStop) faceStop();
  $('modal').hidden = true;
  $('modalBody').innerHTML = '';
  clearTimeout(state.cooldown);
}
$('modalClose').onclick = closeModal;
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function downloadBlob(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function downloadCSV(name, header, rows) {
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [header, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
  downloadBlob(name, new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' }));
}
async function fetchAll(table, cols) {
  let out = [], from = 0;
  while (true) {
    const { data, error } = await sb.from(table).select(cols).order('id').range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function upsertChunks(table, rows, opts) {
  let out = [];
  for (let i = 0; i < rows.length; i += 500) {
    const { data, error } = await sb.from(table).upsert(rows.slice(i, i + 500), opts).select();
    if (error) throw error;
    out = out.concat(data || []);
  }
  return out;
}
async function insertChunks(table, rows) {
  for (let i = 0; i < rows.length; i += 500) {
    const { error } = await sb.from(table).insert(rows.slice(i, i + 500));
    if (error) throw error;
  }
}

function classNameOf(id) { return (state.classes.find(c => c.id === id) || {}).name || ''; }
function classBase(id) { return Number((state.classes.find(c => c.id === id) || {}).base_fee || 0); }

function messageText(name, status, date) {
  if (state.msgLang === 'en') {
    const st = status === 'A' ? 'absent from school today' : status === 'T' ? 'late to school today' : 'on leave today';
    return `Assalam o Alaikum!\nYour child ${name} was ${st}.\nDate: ${prettyDate(date)}\n\nAl Suffah High School`;
  }
  const line = status === 'T' ? 'آج اسکول میں دیر سے پہنچا' : `اسکول سے ${status === 'A' ? 'غیر حاضر تھا' : 'چھٹی پر تھا'}`;
  return `السلام علیکم!\nآپ کا بچہ ${name}\nآج مورخہ ${prettyDate(date)}\n${line}\n\nالصفہ ہائی اسکول`;
}
function reportText(x, kind, start, end) {
  const warn = x.A > 7;
  if (state.msgLang === 'en') {
    const per = kind === 'weekly' ? 'this week' : 'this month';
    let m = `Assalam o Alaikum!\nYour child ${x.name}\nPeriod: ${prettyDate(start)} to ${prettyDate(end)}\nPresent: ${x.P} | Absent: ${x.A} | Leave: ${x.L} | Late: ${x.T}`;
    if (warn) m += `\n\nYour child has ${x.A} absences ${per}. This may affect academic performance. Kindly take notice.`;
    return m + `\n\nAl Suffah High School`;
  }
  const per = kind === 'weekly' ? 'اس ہفتے' : 'اس مہینے';
  let m = `السلام علیکم!\nآپ کا بچہ ${x.name}\nمدت: ${prettyDate(start)} تا ${prettyDate(end)}\nحاضر: ${x.P} | غیر حاضر: ${x.A} | چھٹی: ${x.L} | لیٹ: ${x.T}`;
  if (warn) m += `\n\nآپ کے بچے کی ${per} ${x.A} غیر حاضریاں ہیں، جس سے تعلیمی پوزیشن متاثر ہو سکتی ہے۔ براہ کرم توجہ دیں۔`;
  return m + `\n\nالصفہ پبلک ہائی اسکول`;
}

function copyText(text) {
  const ok = () => toast(t('copied'));
  const fail = () => toast('Copy failed', true);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok).catch(fail);
  else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy') ? ok() : fail(); } catch (e) { fail(); }
    ta.remove();
  }
}

async function logMessage(s, channel) {
  const { error } = await sb.from('message_logs').insert({
    student_id: s.id, date: state.date, channel, sent_by: state.user.id
  });
  if (error) toast('Message log could not be saved', true);
}
async function sendRaw(s, channel, text) {
  if (channel === 'wa') {
    if (!isValidMobile(s.mobile)) return toast(`${s.name}: invalid mobile`, true);
    window.open(`https://wa.me/${normalizePK(s.mobile)}?text=${encodeURIComponent(text)}`, '_blank');
    logMessage(s, 'wa');
  } else {
    const num = smsNum(s);
    if (!isValidMobile(num)) return toast(t('noNumber'), true);
    await logMessage(s, 'sms');
    location.href = `sms:+${normalizePK(num)}${/iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?'}body=${encodeURIComponent(text)}`;
  }
}
const sendMessage = (s, ch) => sendRaw(s, ch, messageText(s.name, state.att.get(s.id) || 'P', state.date));

function callStudent(s, mode) {
  if (mode === 'wa') {
    if (!isValidMobile(s.mobile)) return toast(t('noNumber'), true);
    window.open(`https://wa.me/${normalizePK(s.mobile)}`, '_blank');
  } else {
    const num = smsNum(s);
    if (!isValidMobile(num)) return toast(t('noNumber'), true);
    location.href = 'tel:+' + normalizePK(num);
  }
}

function handleSession(session) {
  if (!session) {
    state.user = null; state.inited = false;
    $('loginScreen').hidden = false; $('app').hidden = true;
    return;
  }
  state.user = session.user;
  $('loginScreen').hidden = true; $('app').hidden = false;
  $('userPhone').textContent = '👤 ' + (session.user.email || '').replace(DOMAIN, '');
  if (!state.inited) { state.inited = true; init(); }
}

/* ---------- شروع اور لوڈ ---------- */
async function init() {
  state.date = todayStr();
  $('datePick').value = state.date;
  await loadClasses();
  const saved = store.get('lastClassId');
  if (saved && [...$('classPick').options].some(o => o.value === saved)) $('classPick').value = saved;
  await loadDay();
}
$('classPick').onchange = () => loadDay();
$('datePick').onchange = () => loadDay();

function fillClassPick() {
  const cur = $('classPick').value || 'all';
  $('classPick').innerHTML = `<option value="all">${t('allClasses')}</option>` +
    state.classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('classPick').value = cur;
}
async function loadClasses() {
  const { data, error } = await sb.from('classes').select('id,name,base_fee,sort_order').order('sort_order');
  if (error) return toast(error.message, true);
  state.classes = data || [];
  fillClassPick();
}
async function loadFeeMap() {
  const { data } = await sb.from('fee_voucher_status').select('student_id,outstanding');
  state.feeMap = {};
  (data || []).forEach(r => { state.feeMap[r.student_id] = (state.feeMap[r.student_id] || 0) + Number(r.outstanding || 0); });
}
async function loadDay() {
  if (!state.classes.length) return;
  const seq = ++state.seq;
  state.classId = $('classPick').value || 'all';
  state.date = $('datePick').value || todayStr();
  store.set('lastClassId', state.classId);

  let q = sb.from('students').select('*').eq('is_active', true);
  q = state.classId === 'all' ? q.in('class_id', state.classes.map(c => c.id)) : q.eq('class_id', Number(state.classId));
  const { data, error } = await q;
  if (seq !== state.seq) return;
  if (error) return toast(error.message, true);
  state.students = (data || []).sort(byAdm);
  state.att = new Map();
  const ids = state.students.map(s => s.id);

  if (ids.length) {
    const { data: rows, error: e2 } = await sb.from('attendance').select('student_id,status').eq('date', state.date).in('student_id', ids);
    if (seq !== state.seq) return;
    if (e2) return toast(e2.message, true);
    (rows || []).forEach(r => state.att.set(r.student_id, r.status));
    const missing = ids.filter(id => !state.att.has(id))
      .map(id => ({ student_id: id, date: state.date, status: 'P', updated_by: state.user.id }));
    if (missing.length) {
      const { error: e3 } = await sb.from('attendance').upsert(missing, { onConflict: 'student_id,date', ignoreDuplicates: true });
      if (e3) return toast(e3.message, true);
      missing.forEach(m => state.att.set(m.student_id, 'P'));
    }
  }
  await loadFeeMap();
  await loadAlerts();
  render();
}
async function loadAlerts() {
  state.alerts = [];
  const ids = state.students.map(s => s.id);
  if (!ids.length) return;
  const { data, error } = await sb.from('attendance').select('student_id,date,status')
    .in('student_id', ids).gte('date', addDays(state.date, -14)).lte('date', state.date)
    .order('date', { ascending: false });
  if (error) return;
  const by = new Map();
  (data || []).forEach(r => { if (!by.has(r.student_id)) by.set(r.student_id, []); by.get(r.student_id).push(r); });
  by.forEach((rows, sid) => {
    let run = 0;
    for (const r of rows) { if (r.status === 'A' || r.status === 'L') run++; else break; }
    const hit = ALERT_DAYS.filter(d => run >= d).pop();
    if (hit) {
      const s = state.students.find(x => x.id === sid);
      if (s) state.alerts.push({ s, days: run });
    }
  });
  state.alerts.sort((a, b) => b.days - a.days);
}

/* ---------- حاضری ---------- */
const NEXT = { P: 'A', A: 'L', L: 'T', T: 'P' };
async function saveAtt(items) {
  return sb.from('attendance').upsert(
    items.map(i => ({ student_id: i.student_id, date: state.date, status: i.status, updated_by: state.user.id })),
    { onConflict: 'student_id,date' });
}
async function setStatus(id, status, silent = false) {
  const prev = state.att.get(id) || 'P';
  state.att.set(id, status);
  render();
  const { error } = await saveAtt([{ student_id: id, status }]);
  if (error) { state.att.set(id, prev); render(); return toast(error.message, true); }
  if (prev !== status) {
    const { data: rec } = await sb.from('attendance').select('id').eq('student_id', id).eq('date', state.date).maybeSingle();
    await sb.from('attendance_audit_logs').insert({
      attendance_id: rec ? rec.id : null, student_id: id, old_status: prev, new_status: status, changed_by: state.user.id
    });
  }
  if (!silent) loadAlerts().then(render);
}
$('markAllBtn').onclick = async () => {
  if (!state.students.length) return toast('Add students to this class first', true);
  state.students.forEach(s => state.att.set(s.id, 'P'));
  render();
  const { error } = await saveAtt(state.students.map(s => ({ student_id: s.id, status: 'P' })));
  toast(error ? error.message : '✅ All students marked present', !!error);

/* ---------- چہرہ ---------- */
function distanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000, toR = d => d * Math.PI / 180;
  const dLat = toR(lat2 - lat1), dLon = toR(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toR(lat1)) * Math.cos(toR(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function checkLocation() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Location not supported'));
    navigator.geolocation.getCurrentPosition(p => {
      const d = distanceM(p.coords.latitude, p.coords.longitude, SCHOOL_LAT, SCHOOL_LNG);
      d <= SCHOOL_RADIUS_M ? res(d) : rej(new Error(`You are outside the school area (${Math.round(d)} m)`));
    }, () => rej(new Error('Location permission denied')), { enableHighAccuracy: true, timeout: 15000 });
  });
}
let faceReady = null;
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('library load failed'));
    document.head.appendChild(s);
  });
}
function ensureFace() {
  if (!faceReady) {
    faceReady = (async () => {
      await loadScript(FACE_LIB);
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS),
        faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS),
        faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS)
      ]);
    })().catch(e => { faceReady = null; throw e; });
  }
  return faceReady;
}
async function startCam(video) {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
  video.srcObject = stream;
  await video.play();
  return stream;
}
async function openFaceRegister(s) {
  openModal(`📸 ${s.name}`, `
    <p class="hint" id="faceMsg">⏳ Please wait...</p>
    <div class="cam"><video id="camV" playsinline muted></video></div>
    <div class="ma"><button class="btn b-green" id="capBtn">📸 Capture</button></div>`);
  let stream = null;
  const stop = () => { if (stream) stream.getTracks().forEach(tr => tr.stop()); stream = null; faceStop = null; };
  faceStop = stop;
  try {
    await ensureFace();
    stream = await startCam($('camV'));
    $('faceMsg').textContent = 'Look at the camera, one face only, good light. Then press Capture.';
  } catch (e) { $('faceMsg').textContent = 'Error: ' + e.message; return; }
  $('capBtn').onclick = async () => {
    try {
      const det = await faceapi.detectSingleFace($('camV'), new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
      if (!det) return toast(t('faceNone'), true);
      const desc = Array.from(det.descriptor);
      const { error } = await sb.from('students').update({ face_descriptor: desc }).eq('id', s.id);
      if (error) return toast(error.message, true);
      s.face_descriptor = desc;
      stop(); closeModal(); toast('✅ Face saved');
    } catch (e) { toast('Error: ' + e.message, true); }
  };
}
async function openFaceCheckin() {
  if (!state.students.length) return toast('Add students to this class first', true);
  const enrolled = state.students.filter(s => Array.isArray(s.face_descriptor) && s.face_descriptor.length);
  if (!enrolled.length) return toast('No student in this class has a registered face yet', true);
  openModal('📷 Face check-in', `
    <p class="hint" id="faceMsg">⏳ Please wait...</p>
    <div class="cam"><video id="camV" playsinline muted></video></div>
    <div id="checked" class="actions"></div>`);
  let stream = null, timer = null, busy = false;
  const done = new Set();
  const stop = () => { clearInterval(timer); if (stream) stream.getTracks().forEach(tr => tr.stop()); stream = null; faceStop = null; };
  faceStop = stop;
  try {
    await checkLocation();
    await ensureFace();
    const matcher = new faceapi.FaceMatcher(
      enrolled.map(s => new faceapi.LabeledFaceDescriptors(String(s.id), [new Float32Array(s.face_descriptor)])), FACE_THRESHOLD);
    stream = await startCam($('camV'));
    $('faceMsg').textContent = '👀 Look at the camera...';
    timer = setInterval(async () => {
      if (busy) return;
      busy = true;
      try {
        const det = await faceapi.detectSingleFace($('camV'), new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
        if (det) {
          const m = matcher.findBestMatch(det.descriptor);
          if (m.label !== 'unknown') {
            const id = Number(m.label);
            const s = state.students.find(x => x.id === id);
            if (s && !done.has(id)) {
              done.add(id);
              await setStatus(id, 'P', true);
              $('checked').insertAdjacentHTML('beforeend', `<span class="chip P">✅ ${esc(s.name)}</span>`);
              $('faceMsg').textContent = `✅ ${s.name}`;
            }
          }
        }
      } catch (e) { /* skip frame */ }
      busy = false;
    }, 1000);
  } catch (e) { $('faceMsg').textContent = 'Error: ' + e.message; stop(); }
}
$('faceCheckBtn').onclick = openFaceCheckin;

function renderQueue() {
  const list = state.queue.map(id => state.students.find(x => x.id === id)).filter(Boolean);
  const next = list.find(s => !state.queueDone.has(s.id));
  const remaining = state.lastWa + COOLDOWN_MS - Date.now();
  clearTimeout(state.cooldown);
  if (next && remaining > 0) state.cooldown = setTimeout(renderQueue, remaining + 50);
  const label = !next ? '✅ All messages sent' : remaining > 0 ? `Wait ${Math.ceil(remaining / 1000)} sec...` : `▶ Next: ${next.name}`;
  $('modalBody').innerHTML = `
    <p class="hint">Each click opens WhatsApp with the message ready. Press Send there. A short wait between messages protects your account.</p>
    <div class="actions" style="margin:10px 0">
      <button class="btn b-wa" id="queueNext" ${(!next || remaining > 0) ? 'disabled' : ''}>${label}</button>
    </div>
    <table>
      <tr><th>#</th><th>Name</th><th>Mobile</th><th>Status</th><th>✔</th></tr>
      ${list.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.name)}</td><td>${esc(s.mobile)}</td>
        <td>${statusLabelOf(state.att.get(s.id))}</td><td>${state.queueDone.has(s.id) ? '✅' : ''}</td></tr>`).join('')}

  const btn = $('queueNext');
  if (btn && next) btn.onclick = () => {
    if (!isValidMobile(next.mobile)) return toast(`${next.name}: invalid mobile`, true);
    state.lastWa = Date.now();
    state.queueDone.add(next.id);
    sendMessage(next, 'wa');
    renderQueue();
  };
}

async function fetchRange(start, end) {
  const ids = state.students.map(s => s.id);
  let out = [], from = 0;
  if (!ids.length) return out;
  while (true) {
    const { data, error } = await sb.from('attendance').select('student_id,date,status')
      .in('student_id', ids).gte('date', start).lte('date', end).order('id').range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function openReport(kind) {
  if (!state.students.length) return toast('Add students to this class first', true);
  const end = state.date;
  let start = end, title = '📊 Daily report';
  if (kind === 'weekly') { start = addDays(end, -6); title = '📈 Weekly report'; }
  if (kind === 'monthly') { start = addDays(end, -29); title = '📉 Monthly report'; }
  try {
    const rows = await fetchRange(start, end);
    const stats = new Map(state.students.map(s => [s.id, { s, name: s.name, adm: s.admission_no, P: 0, A: 0, L: 0, T: 0 }]));
    rows.forEach(r => { const st = stats.get(r.student_id); if (st) st[r.status]++; });
    repRows = [...stats.values()].sort((a, b) => byAdm(a.s, b.s)).map(x => {
      const total = x.P + x.A + x.L + x.T;
      return { ...x, total, pct: total ? Math.round(x.P / total * 100) : 0 };
    });
    repKind = kind; repStart = start; repEnd = end;
    openModal(`${title} (${prettyDate(start)} – ${prettyDate(end)})`, `
      <div class="actions" style="margin-bottom:10px">
        <button class="btn b-blue" id="repPrint">🖨 Print / PDF</button>
        <button class="btn b-yellow" id="repCsv">📥 Download CSV</button>
      </div>
      <table>
        <tr><th>#</th><th>Admission No</th><th>Name</th><th>Present</th><th>Absent</th><th>Leave</th><th>Late</th><th>Records</th><th>%</th><th>Message</th></tr>
        ${repRows.map((x, i) => `<tr>
          <td>${i + 1}</td><td>${esc(x.adm)}</td>
          <td>${esc(x.name)}${x.A > 7 ? ' <span class="warn">⚠️</span>' : ''}</td>
          <td>${x.P}</td><td class="${x.A > 7 ? 'warn' : ''}">${x.A}</td>
          <td>${x.L}</td><td>${x.T}</td><td>${x.total}</td><td>${x.pct}%</td>
          <td class="nowrap">
            <button class="btn sm wa" data-rwa="${i}">WA</button>
            <button class="btn sm sms" data-rsms="${i}">SMS</button>
          </td></tr>`).join('')}
      </table>`);
    $('repPrint').onclick = () => { document.body.classList.add('print-modal'); window.print(); };
    $('repCsv').onclick = () => downloadCSV(`report_${start}_${end}.csv`,
      ['Admission No', 'Name', 'Present', 'Absent', 'Leave', 'Late', 'Records', 'Attendance %'],
      repRows.map(x => [x.adm, x.name, x.P, x.A, x.L, x.T, x.total, x.pct + '%']));
  } catch (err) { toast('Report failed: ' + err.message, true); }
}

async function restoreData(p) {
  if (!p || !Array.isArray(p.classes) || !Array.isArray(p.students)) throw new Error('Invalid backup file');

  const savedClasses = await upsertChunks('classes',
    p.classes.map(c => ({ name: c.name, sort_order: c.sort_order ?? 0, base_fee: c.base_fee ?? 0 })), { onConflict: 'name' });
  const classByName = new Map(savedClasses.map(c => [c.name, c.id]));
  const oldClassToNew = new Map(p.classes.map(c => [c.id, classByName.get(c.name)]));

  const savedStudents = await upsertChunks('students',
    p.students.map(s => ({
      name: s.name, admission_no: String(s.admission_no), mobile: String(s.mobile),
      section: s.section ?? null, sim_number: s.sim_number ?? null, father_name: s.father_name ?? null,
      father_cnic: s.father_cnic ?? null, address: s.address ?? null, face_descriptor: s.face_descriptor ?? null,
      roll_number: s.roll_number ?? null, date_of_birth: s.date_of_birth ?? null, gender: s.gender ?? null,
      monthly_fee: s.monthly_fee ?? null, admission_date: s.admission_date ?? null,
      previous_school: s.previous_school ?? null, exam_fee: s.exam_fee ?? 0, sports_fee: s.sports_fee ?? 0,
      admission_fee: s.admission_fee ?? 0, fee_concession_pct: s.fee_concession_pct ?? 0, credit: s.credit ?? 0,
      class_id: oldClassToNew.get(s.class_id) ?? null,
      expected_class_id: s.expected_class_id ? (oldClassToNew.get(s.expected_class_id) ?? null) : null,
      is_active: s.is_active !== false
    })),
    { onConflict: 'admission_no' });
  const studentByAdm = new Map(savedStudents.map(s => [String(s.admission_no), s.id]));
  const oldStudentToNew = new Map(p.students.map(s => [s.id, studentByAdm.get(String(s.admission_no))]));

  const attRows = (p.attendance || [])
    .map(a => ({ student_id: oldStudentToNew.get(a.student_id), date: a.date, status: a.status, updated_by: null }))
    .filter(r => r.student_id);
  await upsertChunks('attendance', attRows, { onConflict: 'student_id,date' });

  const logRows = (p.message_logs || [])
    .map(m => ({ student_id: oldStudentToNew.get(m.student_id), date: m.date, channel: m.channel, sent_by: null }))
    .filter(r => r.student_id);
  if (logRows.length) await insertChunks('message_logs', logRows);

  const oldVoucherToNew = new Map();
  if (Array.isArray(p.fee_vouchers) && p.fee_vouchers.length) {
    const vRows = p.fee_vouchers.map(v => ({
      old: v.id,
      row: {
        student_id: oldStudentToNew.get(v.student_id), fee_year: v.fee_year, fee_month: v.fee_month,
        base_fee: v.base_fee ?? 0, one_time_fee: v.one_time_fee ?? 0, sibling_discount: v.sibling_discount ?? 0,
        concession: v.concession ?? 0, fine: v.fine ?? 0, credit_applied: v.credit_applied ?? 0
      }
    })).filter(x => x.row.student_id);
    const saved = await upsertChunks('fee_vouchers', vRows.map(x => x.row), { onConflict: 'student_id,fee_year,fee_month' });
    const byKey = new Map(saved.map(v => [`${v.student_id}-${v.fee_year}-${v.fee_month}`, v.id]));
    vRows.forEach(x => {
      const nid = byKey.get(`${x.row.student_id}-${x.row.fee_year}-${x.row.fee_month}`);
      if (nid) oldVoucherToNew.set(x.old, nid);
    });
  }

  const oldPaymentToNew = new Map();
  if (Array.isArray(p.fee_payments) && p.fee_payments.length) {
    const pRows = p.fee_payments.map(x => ({
      old: x.id,
      row: {
        student_id: oldStudentToNew.get(x.student_id), amount: x.amount, method: x.method, note: x.note ?? null,
        receipt_no: x.receipt_no, paid_at: x.paid_at, unallocated: x.unallocated ?? 0
      }
    })).filter(x => x.row.student_id && x.row.receipt_no);
    const saved = await upsertChunks('fee_payments', pRows.map(x => x.row), { onConflict: 'receipt_no' });
    const byRc = new Map(saved.map(x => [x.receipt_no, x.id]));
    pRows.forEach(x => {
      const nid = byRc.get(x.row.receipt_no);
      if (nid) oldPaymentToNew.set(x.old, nid);
    });
  }
  if (Array.isArray(p.fee_payment_allocations) && p.fee_payment_allocations.length) {
    const newPayIds = [...new Set([...oldPaymentToNew.values()])];
    if (newPayIds.length) await sb.from('fee_payment_allocations').delete().in('payment_id', newPayIds);
    const aRows = p.fee_payment_allocations.map(a => ({
      payment_id: oldPaymentToNew.get(a.payment_id), voucher_id: oldVoucherToNew.get(a.voucher_id), amount: a.amount
    })).filter(r => r.payment_id && r.voucher_id);
    if (aRows.length) await insertChunks('fee_payment_allocations', aRows);
  }

  if (Array.isArray(p.fee_settings) && p.fee_settings[0]) {
    const s = p.fee_settings[0];
    await sb.from('fee_settings').upsert({
      id: 1, bill_note_ur: s.bill_note_ur ?? '', bill_note_en: s.bill_note_en ?? '',
      accountant_name: s.accountant_name ?? '', bill_show_breakdown: s.bill_show_breakdown ?? true,
      reminder_tpl_ur: s.reminder_tpl_ur ?? '', reminder_tpl_en: s.reminder_tpl_en ?? ''
    });
  }

  if (Array.isArray(p.expenses) && p.expenses.length) {
    const { data: existing } = await sb.from('expenses').select('expense_date,category,amount,note');
    const keys = new Set((existing || []).map(x => `${x.expense_date}|${x.category}|${x.amount}|${x.note ?? ''}`));
    const missing = p.expenses
      .filter(x => !keys.has(`${x.expense_date}|${x.category}|${x.amount}|${x.note ?? ''}`))
      .map(x => ({ kind: x.kind || 'expense', expense_date: x.expense_date, category: x.category, amount: x.amount, note: x.note ?? null }));
    if (missing.length) await insertChunks('expenses', missing);
  }
}

/* ---------- شروع ---------- */
function start() {
  applyLang();
  $('datePick').value = todayStr();
  sb.auth.getSession().then(({ data }) => handleSession(data.session));
  sb.auth.onAuthStateChange((_e, session) => handleSession(session));
}
start();
</script>
