<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Suffah Attendance System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#0d6efd; --green:#198754; --teal:#0dcaf0; --orange:#fd7e14;
  --purple:#6f42c1; --red:#dc3545; --yellow:#ffc107; --pink:#d63384;
  --bg:#f0f4ff; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);margin:0;padding:12px;color:var(--text);-webkit-text-size-adjust:100%}
h2{margin:0;font-size:20px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
header{background:linear-gradient(90deg,#6f42c1,#0d6efd,#0dcaf0);color:#fff;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
header .user{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:bold;color:#374151}
input,select,textarea{padding:9px;border:2px solid #d1d5db;border-radius:8px;font-size:16px;background:#fff;max-width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
<!-- GitHub Auto Update Test -->  
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:none;color:#fff;background-color:#6c757d;background-image:linear-gradient(to bottom,rgba(255,255,255,.28),rgba(0,0,0,.08));padding:9px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:bold;text-shadow:0 1px 1px rgba(0,0,0,.25);box-shadow:0 4px 0 rgba(0,0,0,.28),0 6px 12px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s,filter .2s;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.primary{background-color:var(--blue)}
.btn.success{background-color:var(--green)}
.btn.wa{background-color:#25D366}
.btn.sms{background-color:var(--teal);color:#000;text-shadow:none}
.btn.copy{background-color:var(--orange)}
.btn.file{background-color:#475569}
.btn.purple{background-color:var(--purple)}
.btn.pink{background-color:var(--pink)}
.btn.yellow{background-color:var(--yellow);color:#000;text-shadow:none}
.btn.dark{background-color:#374151}
.btn.del{background-color:var(--red)}
.btn.ghost{background-color:rgba(255,255,255,.2);border:1px solid #fff;color:#fff}
.btn.edit{background-color:#f59e0b;color:#000;text-shadow:none}
.btn.teal{background-color:#0f766e}
.btn.face{background-color:#7c3aed}
.btn.call{background-color:#2563eb}
.summary{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;align-items:center}
.chip{padding:6px 12px;border-radius:20px;font-weight:bold;background:#e5e7eb}
.chip.total{background:#e0e7ff;color:#3730a3}
.chip.P{background:#d1fae5;color:#065f46}
.chip.A{background:#fee2e2;color:#991b1b}
.chip.L{background:#fef3c7;color:#92400e}
.chip.T{background:#ffedd5;color:#9a3412}
.chip.pct{background:#ede9fe;color:#5b21b6}
.bar{flex:1;min-width:160px;height:14px;background:#e5e7eb;border-radius:10px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399);transition:width .4s}
.table-wrap{overflow-x:auto;padding:0;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
th,td{border:1px solid #e5e7eb;padding:7px;text-align:center}
th{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;position:sticky;top:0}
tr:nth-child(even) td{background:#fafafa}
.status{border:none;padding:7px 10px;border-radius:8px;cursor:pointer;font-weight:bold;min-width:120px;transition:transform .1s}
.status:active{transform:scale(.95)}
.status.P{background:#d1fae5;color:#065f46}
.status.A{background:#fee2e2;color:#991b1b}
.status.L{background:#fef3c7;color:#92400e}
.status.T{background:#ffedd5;color:#9a3412}
.nowrap{white-space:nowrap}
.empty{padding:20px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.warn{color:#dc2626;font-weight:bold}
.alert{background:#fff7ed;border:2px solid #fb923c;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.alert.red{background:#fef2f2;border-color:#f87171}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:linear-gradient(135deg,#ffffff,#eef2ff);border-radius:14px;padding:12px;text-align:center;box-shadow:0 6px 14px rgba(79,70,229,.15),inset 0 -3px 0 rgba(79,70,229,.12);cursor:pointer;transition:transform .15s}
.kpi:hover{transform:translateY(-3px)}
.kpi b{display:block;font-size:24px;color:#3730a3}
.kpi span{font-size:12px;color:var(--muted)}
.cam{background:#000;border-radius:12px;overflow:hidden;margin:10px 0}
.cam video{width:100%;display:block;transform:scaleX(-1)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;margin:-12px;background:linear-gradient(135deg,#6f42c1,#0d6efd,#0dcaf0)}
.login-card{width:min(360px,92vw);display:grid;gap:12px}
.login-card h2{color:#4f46e5}
.msg{color:var(--red);font-size:13px;margin:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:10px;z-index:50}
.modal-box{background:#fff;border-radius:14px;padding:18px;width:min(900px,100%);max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.form{display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
select.lang{background:#fff;color:#1f2937;padding:6px;font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.3s;z-index:60;font-weight:bold;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
@media print{
  .btn,.hint,.toolbar,.actions,header,#toast,.bar,.kpis,.alert{display:none!important}
  th:nth-child(6),td:nth-child(6),th:nth-child(7),td:nth-child(7),th:nth-child(8),td:nth-child(8){display:none}
  body{background:#fff}
  body.print-modal #app{display:none!important}
  body.print-modal #modal{position:static;background:none}
  body.print-modal .modal-box{box-shadow:none;max-height:none;overflow:visible}
}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="card login-card">
    <h2 style="text-align:center" data-i18n="loginTitle">Al Suffah High School<br>Attendance System</h2>
    <input id="loginPhone" type="tel" data-i18n-ph="phonePh" placeholder="Mobile number (e.g. 03001234567)" autocomplete="username">
    <input id="loginPass" type="password" data-i18n-ph="passPh" placeholder="Password" autocomplete="current-password">
    <button class="btn primary" id="loginBtn" data-i18n="login">🔐 Login</button>
    <p id="loginMsg" class="msg"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <h2 data-i18n="appTitle">🏫 Al Suffah – Attendance</h2>
    <div class="user">
      <span id="userPhone"></span>
      <select id="langPick" class="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="ur">اردو</option>
      </select>
      <button class="btn ghost" id="logoutBtn" data-i18n="logout">Logout</button>
    </div>
  </header>

  <div id="alertBox"></div>

  <section class="kpis" id="kpis"></section>

  <section class="card toolbar">
    <label><span data-i18n="date">📅 Date</span> <input type="date" id="datePick"></label>
    <label><span data-i18n="classLbl">🎓 Class</span> <select id="classPick"></select></label>
    <label><span data-i18n="search">🔍 Search</span> <input id="search" data-i18n-ph="searchPh" placeholder="Name or admission no."></label>
    <button class="btn primary" id="addBtn" data-i18n="addStudent">➕ Add student</button>
    <button class="btn success" id="markAllBtn" data-i18n="markAll">✅ Mark all present</button>
    <button class="btn face" id="faceCheckBtn" data-i18n="faceCheckBtn">📷 Face check-in</button>
  </section>

  <section class="card summary" id="summary"></section>

  <section class="card actions">
    <label><span data-i18n="msgLang">Parent message language:</span>
      <select id="msgLangPick" class="lang">
        <option value="ur">اردو</option>
        <option value="en">English</option>
      </select>
    </label>
    <button class="btn wa" id="sendAbsentBtn" data-i18n="sendAbsent">📩 Message parents of absent students</button>
    <button class="btn pink" id="showAbsentBtn" data-i18n="showAbsent">🚫 Absent students</button>
    <button class="btn purple" id="dailyBtn" data-i18n="daily">📊 Daily report</button>
    <button class="btn purple" id="weeklyBtn" data-i18n="weekly">📈 Weekly report</button>
    <button class="btn purple" id="monthlyBtn" data-i18n="monthly">📉 Monthly report</button>
    <button class="btn yellow" id="csvBtn" data-i18n="csv">📥 Export CSV</button>
    <button class="btn dark" id="printBtn" data-i18n="print">🖨️ Print / PDF</button>
    <a class="btn purple" href="fees.html">💰 فیس سسٹم</a>
    <button class="btn" id="refreshBtn" data-i18n="refresh">🔄 Refresh</button>
    <button class="btn teal" id="backupBtn" data-i18n="backup">💾 Backup</button>
    <button class="btn teal" id="restoreBtn" data-i18n="restore">📤 Restore backup</button>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
    <input type="file" id="fileInput" hidden>
    <button class="btn del" id="resetDayBtn" data-i18n="reset">♻️ Reset this day</button>
  </section>

  <div class="card table-wrap">
    <table>
      <thead>
        <tr>
          <th data-i18n="colNo">#</th>
          <th data-i18n="colName">Name</th>
          <th data-i18n="colAdm">Admission No</th>
          <th data-i18n="colStatus">Status</th>
          <th data-i18n="colMobile">Mobile</th>
          <th data-i18n="colMsg">Message</th>
          <th data-i18n="colEdit">Edit</th>
          <th data-i18n="colDel">Delete</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p class="hint" data-i18n="hint">Click the status button: P (Present) → A (Absent) → L (Leave) → T (Late). Every change is saved immediately.</p>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3 id="modalTitle" style="margin-top:0"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions"><button class="btn dark" id="modalClose" data-i18n="close">Close</button></div>
  </div>
</div>

<div id="toast"></div>

function normalizePK(num) {

  if (d.startsWith('00')) d = d.slice(2);

  else if (d.length === 10 && d.startsWith('3')) d = '92' + d;
  return d;
}

function copyText(text) {
  const ok = () => toast(t('copied'));

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(ok).catch(fail);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy') ? ok() : fail(); } catch { fail(); }
    ta.remove();
  }
}

async function fetchAll(table, cols) {
  let out = [], from = 0;
  while (true) {
    const { data, error } = await sb.from(table).select(cols).order('id').range(from, from + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}

async function upsertChunks(table, rows, opts) {
  let out = [];
  for (let i = 0; i < rows.length; i += 500) {
    const { data, error } = await sb.from(table).upsert(rows.slice(i, i + 500), opts).select();
    if (error) throw error;
    out = out.concat(data || []);
  }
  return out;
}

async function insertChunks(table, rows) {
  for (let i = 0; i < rows.length; i += 500) {
    const { error } = await sb.from(table).insert(rows.slice(i, i + 500));
    if (error) throw error;
  }
}

function distanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000, toR = d => d * Math.PI / 180;
  const dLat = toR(lat2 - lat1), dLon = toR(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toR(lat1)) * Math.cos(toR(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function checkLocation() {
  return new Promise((res, rej) => {
    if (SCHOOL_LAT == null || SCHOOL_LNG == null) return rej(new Error(t('locNotSet')));
    if (!navigator.geolocation) return rej(new Error(t('locDenied')));
    navigator.geolocation.getCurrentPosition(p => {
      const d = distanceM(p.coords.latitude, p.coords.longitude, SCHOOL_LAT, SCHOOL_LNG);
      d <= SCHOOL_RADIUS_M ? res(d) : rej(new Error(t('locFar', Math.round(d))));
    }, () => rej(new Error(t('locDenied'))), { enableHighAccuracy: true, timeout: 15000 });
  });
}

async function loadDay() {
  if (!state.classes.length) return;
  const seq = ++state.seq;
  state.classId = $('classPick').value || 'all';
  state.date = $('datePick').value || todayStr();
  store.set('lastClassId', state.classId);

  let q = sb.from('students').select('*').eq('is_active', true).order('name');
  q = state.classId === 'all'
    ? q.in('class_id', state.classes.map(c => c.id))
    : q.eq('class_id', Number(state.classId));
  const { data: students, error } = await q;
  if (seq !== state.seq) return;
  if (error) return toast(t('loadFail', error.message), true);

  state.students = students;
  state.att = new Map();
  const ids = students.map(s => s.id);

  if (ids.length) {
    const { data: rows, error: e2 } = await sb.from('attendance')
      .select('student_id,status').eq('date', state.date).in('student_id', ids);
    if (seq !== state.seq) return;
    if (e2) return toast(t('loadFail', e2.message), true);
    rows.forEach(r => state.att.set(r.student_id, r.status));

    const missing = ids.filter(id => !state.att.has(id))
      .map(id => ({ student_id: id, date: state.date, status: 'P', updated_by: state.user.id }));
    if (missing.length) {
      const { error: e3 } = await sb.from('attendance')
        .upsert(missing, { onConflict: 'student_id,date', ignoreDuplicates: true });
      if (e3) return toast(t('loadFail', e3.message), true);
      missing.forEach(m => state.att.set(m.student_id, 'P'));
    }
  }
  await loadAlerts();
  render();
}

async function loadAlerts() {
  state.alerts = [];
  const ids = state.students.map(s => s.id);
  if (!ids.length) return;
  const { data, error } = await sb.from('attendance')
    .select('student_id,date,status')
    .in('student_id', ids).gte('date', addDays(state.date, -14)).lte('date', state.date)
    .order('date', { ascending: false });
  if (error) return;

  const byStudent = new Map();
  (data || []).forEach(r => {
    if (!byStudent.has(r.student_id)) byStudent.set(r.student_id, []);
    byStudent.get(r.student_id).push(r);
  });
  byStudent.forEach((rows, sid) => {
    let run = 0;
    for (const r of rows) {
      if (r.status === 'A' || r.status === 'L') run++;
      else break;
    }
    const hit = ALERT_DAYS.filter(d => run >= d).pop();
    if (hit) {
      const s = state.students.find(x => x.id === sid);
      if (s) state.alerts.push({ s, days: run });
    }
  });
  state.alerts.sort((a, b) => b.days - a.days);
}

  box.innerHTML = `<div class="alert red"><b>${t('alertTitle')}</b><br>` +
    state.alerts.map(a => esc(t('alertLine', a.s.name, a.days))).join('<br>') + `</div>`;

async function setStatus(id, status, silent = false) {
  const prev = state.att.get(id) || 'P';
  state.att.set(id, status);
  render();
  const { error } = await saveAtt([{ student_id: id, status }]);
  if (error) {
    state.att.set(id, prev);
    render();
    return toast(t('saveFail', error.message), true);
  }
  if (prev !== status) {
    const { data: rec } = await sb.from('attendance').select('id')
      .eq('student_id', id).eq('date', state.date).maybeSingle();
    await sb.from('attendance_audit_logs').insert({
      attendance_id: rec ? rec.id : null,
      student_id: id,
      old_status: prev,
      new_status: status,
      changed_by: state.user.id
    });
  }
  if (!silent) loadAlerts().then(render);
}

async function openFaceRegister(s) {
  openModal(t('faceRegTitle', s.name), `
    <p class="hint" id="faceMsg">${t('working')}</p>
    <div class="cam"><video id="camV" playsinline muted></video></div>
    <div class="modal-actions"><button class="btn success" id="capBtn">${t('faceCapture')}</button></div>`);

  let stream = null;
  const stop = () => {
    if (stream) stream.getTracks().forEach(tr => tr.stop());
    stream = null; faceStop = null;
  };
  faceStop = stop;

  try {
    await ensureFace();
    stream = await startCam($('camV'));
    $('faceMsg').textContent = t('faceRegHint');
  } catch (e) {
    $('faceMsg').textContent = t('faceErr', e.message);
    return;
  }

  $('capBtn').onclick = async () => {
    try {
      const det = await faceapi.detectSingleFace($('camV'), detectOpts())
        .withFaceLandmarks().withFaceDescriptor();
      if (!det) return toast(t('faceNone'), true);
      const desc = Array.from(det.descriptor);
      const { error } = await sb.from('students').update({ face_descriptor: desc }).eq('id', s.id);
      if (error) return toast(t('saveFail', error.message), true);
      s.face_descriptor = desc;
      stop();
      closeModal();
      toast(t('faceSaved'));
    } catch (e) {
      toast(t('faceErr', e.message), true);
    }
  };
}

async function openFaceCheckin() {
  if (!state.students.length) return toast(t('pickClassFirst'), true);
  const enrolled = state.students.filter(s => Array.isArray(s.face_descriptor) && s.face_descriptor.length);
  if (!enrolled.length) return toast(t('noFaces'), true);

  openModal(t('faceCheckTitle'), `
    <p class="hint" id="faceMsg">${t('working')}</p>
    <div class="cam"><video id="camV" playsinline muted></video></div>
    <div id="checked" class="actions"></div>`);

  let stream = null, timer = null, busy = false;
  const done = new Set();
  const stop = () => {
    clearInterval(timer);
    if (stream) stream.getTracks().forEach(tr => tr.stop());
    stream = null; faceStop = null;
  };
  faceStop = stop;

  try {
    await checkLocation();
    await ensureFace();

    const matcher = new faceapi.FaceMatcher(
      enrolled.map(s => new faceapi.LabeledFaceDescriptors(String(s.id), [new Float32Array(s.face_descriptor)])),
      FACE_THRESHOLD
    );

    stream = await startCam($('camV'));
    $('faceMsg').textContent = t('faceLooking');

    timer = setInterval(async () => {
      if (busy) return;
      busy = true;
      try {
        const det = await faceapi.detectSingleFace($('camV'), detectOpts())
          .withFaceLandmarks().withFaceDescriptor();
        if (det) {
          const m = matcher.findBestMatch(det.descriptor);
          if (m.label !== 'unknown') {
            const id = Number(m.label);
            const s = state.students.find(x => x.id === id);
            if (s && !done.has(id)) {
              done.add(id);
              await setStatus(id, 'P', true);
              $('checked').insertAdjacentHTML('beforeend', `<span class="chip P">✅ ${esc(s.name)}</span>`);
              $('faceMsg').textContent = t('faceMarked', s.name);
            }
          }
        }
      } catch (e) { /* skip this frame */ }
      busy = false;
    }, 1000);
  } catch (e) {
    $('faceMsg').textContent = t('faceErr', e.message);
    stop();
  }
}

let queueIds = [], queueDone = new Set(), lastWaOpen = 0, cooldownTimer = null;
const COOLDOWN_MS = 10000;

function absentList() {
  return state.students.filter(s => ['A', 'L', 'T'].includes(state.att.get(s.id)));
}

$('sendAbsentBtn').onclick = () => {
  const list = absentList();
  if (!list.length) return toast(t('noAbsent'));
  queueIds = list.map(s => s.id);
  queueDone = new Set();
  lastWaOpen = 0;
  openModal(t('sendTitle', list.length), '');
  renderQueue();
};

function renderQueue() {
  const list = queueIds.map(id => state.students.find(x => x.id === id)).filter(Boolean);
  const next = list.find(s => !queueDone.has(s.id));
  const remaining = lastWaOpen + COOLDOWN_MS - Date.now();

  clearTimeout(cooldownTimer);
  if (next && remaining > 0) cooldownTimer = setTimeout(renderQueue, remaining + 50);

  const label = !next ? t('queueDone')
    : remaining > 0 ? t('queueWait', Math.ceil(remaining / 1000))
    : t('queueNext', next.name);

  $('modalBody').innerHTML = `
    <p class="hint">${t('queueHint')}</p>
    <div class="actions" style="margin:10px 0">
      <button class="btn wa" id="queueNext" ${(!next || remaining > 0) ? 'disabled' : ''}>${label}</button>
    </div>
    <table>
      <tr><th>#</th><th>${t('colName')}</th><th>${t('colMobile')}</th><th>${t('colStatus')}</th><th>✔</th></tr>
      ${list.map((s, i) => `<tr>
        <td>${i + 1}</td>
        <td>${esc(s.name)}</td>
        <td>${esc(s.mobile)}</td>
        <td>${statusLabel(state.att.get(s.id))}</td>
        <td>${queueDone.has(s.id) ? '✅' : ''}</td>
      </tr>`).join('')}
    </table>`;

  const btn = $('queueNext');
  if (btn && next) btn.onclick = () => queueSendNext(next);
}

function queueSendNext(s) {
  if (!isValidMobile(s.mobile)) return toast(t('mobileBad', s.name), true);
  lastWaOpen = Date.now();
  queueDone.add(s.id);
  sendMessage(s, 'wa');
  renderQueue();
}

async function fetchRange(start, end) {
  const ids = state.students.map(s => s.id);
  let out = [], from = 0;
  if (!ids.length) return out;
  while (true) {
    const { data, error } = await sb.from('attendance')
      .select('student_id,date,status')
      .in('student_id', ids).gte('date', start).lte('date', end)
      .order('id').range(from, from + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}

  if (!state.students.length) return toast(t('pickClassFirst'), true);
  const end = state.date;
  let start = end, title = t('reportDaily');
  if (kind === 'weekly') { start = addDays(end, -6); title = t('reportWeekly'); }
  if (kind === 'monthly') { start = addDays(end, -29); title = t('reportMonthly'); }

  try {
    const rows = await fetchRange(start, end);
    const stats = new Map(state.students.map(s =>
      [s.id, { s, name: s.name, adm: s.admission_no, P: 0, A: 0, L: 0, T: 0 }]));
    rows.forEach(r => { const st = stats.get(r.student_id); if (st) st[r.status]++; });

    repRows = [...stats.values()].map(x => {
      const total = x.P + x.A + x.L + x.T;
      return { ...x, total, pct: total ? Math.round(x.P / total * 100) : 0 };
    });
    repKind = kind; repStart = start; repEnd = end;
    const heading = `${title} (${prettyDate(start)} – ${prettyDate(end)})`;

    openModal(heading, `
      <div class="actions" style="margin-bottom:10px">
        <button class="btn primary" id="repPrint">${t('reportPrint')}</button>
        <button class="btn yellow" id="repCsv">${t('reportCsv')}</button>
      </div>
      <table>
        <tr><th>#</th><th>${t('colName')}</th><th>${t('colAdm')}</th><th>${t('colPresent')}</th><th>${t('colAbsent')}</th><th>${t('colLeave')}</th><th>${t('colLate')}</th><th>${t('colRecords')}</th><th>${t('colPct')}</th><th>${t('colMsg')}</th></tr>
        ${repRows.map((x, i) => `<tr>
          <td>${i+1}</td>
          <td>${esc(x.name)}${x.A > 7 ? ' <span class="warn">⚠️</span>' : ''}</td>
          <td>${esc(x.adm)}</td>
          <td>${x.P}</td>
          <td class="${x.A > 7 ? 'warn' : ''}">${x.A}</td>
          <td>${x.L}</td><td>${x.T}</td><td>${x.total}</td><td>${x.pct}%</td>
          <td class="nowrap">
            <button class="btn sm wa" data-rwa="${i}">WA</button>
            <button class="btn sm sms" data-rsms="${i}">SMS</button>
          </td>
        </tr>`).join('')}
      </table>`);

    $('repPrint').onclick = printModal;
    $('repCsv').onclick = () => downloadCSV(
      `report_${start}_${end}.csv`,
      [t('colName'), t('colAdm'), t('colPresent'), t('colAbsent'), t('colLeave'), t('colLate'), t('colRecords'), t('colPct')],
      repRows.map(x => [x.name, x.adm, x.P, x.A, x.L, x.T, x.total, x.pct + '%'])
    );
  } catch (err) {
    toast(t('reportFail', err.message), true);
  }
}

function printModal() {
  document.body.classList.add('print-modal');
  window.print();
}
window.addEventListener('afterprint', () => document.body.classList.remove('print-modal'));

$('dailyBtn').onclick = () => openReport('daily');
$('weeklyBtn').onclick = () => openReport('weekly');
$('monthlyBtn').onclick = () => openReport('monthly');

$('modalBody').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;

  if (d.cwa || d.csim) {
    const s = state.students.find(x => x.id === Number(d.cwa || d.csim));
    if (s) callStudent(s, d.cwa ? 'wa' : 'sim');
    return;
  }
  if (d.mwa || d.msms) {
    const s = state.students.find(x => x.id === Number(d.mwa || d.msms));
    if (s) sendMessage(s, d.mwa ? 'wa' : 'sms');
    return;
  }
  if (d.present) {
    setStatus(Number(d.present), 'P').then(renderAbsentModal);
    return;
  }
  if (d.rwa !== undefined || d.rsms !== undefined) {
    const x = repRows[Number(d.rwa !== undefined ? d.rwa : d.rsms)];
    if (!x) return;
    sendRaw(x.s, d.rwa !== undefined ? 'wa' : 'sms', reportText(x, repKind, repStart, repEnd));
  }
});

$('csvBtn').onclick = () => {
  if (!state.students.length) return toast(t('csvEmpty'), true);
  downloadCSV(
    `attendance_${state.date}.csv`,
    [t('colName'), t('colAdm'), t('colMobile'), t('colStatus')],
    state.students.map(s => [s.name, s.admission_no, s.mobile, statusLabel(state.att.get(s.id) || 'P')])
  );
};
$('printBtn').onclick = () => window.print();

$('refreshBtn').onclick = async () => {
  toast(t('working'));
  await loadClasses();
  await loadDay();
  toast(t('refreshed'));
};

$('fileInput').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  const s = pendingFileStudent;
  pendingFileStudent = null;
  if (!file || !s) return;
  if (!isValidMobile(s.mobile)) return toast(t('mobileBad', s.name), true);

  const text = messageText(s.name, state.att.get(s.id) || 'A', state.date);

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], text });
      logMessage(s, 'wa');
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }

  downloadBlob(file.name, file);
  window.open(`https://wa.me/${normalizePK(s.mobile)}?text=${encodeURIComponent(text)}`, '_blank');
  logMessage(s, 'wa');
  toast(t('fileFallback'));
};

$('backupBtn').onclick = async () => {
  try {
    toast(t('working'));
    const [classes, students, attendance, message_logs, audit] = await Promise.all([
      fetchAll('classes', 'id,name,sort_order'),
      fetchAll('students', '*'),
      fetchAll('attendance', 'id,student_id,date,status'),
      fetchAll('message_logs', 'id,student_id,date,channel'),
      fetchAll('attendance_audit_logs', '*')
    ]);
    const payload = {
      version: 2,
      created_at: new Date().toISOString(),
      classes, students, attendance, message_logs, attendance_audit_logs: audit
    };
    downloadBlob(`backup_${todayStr()}.json`,
      new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
    toast(t('backupDone'));
  } catch (err) {
    toast(t('loadFail', err.message), true);
  }
};

$('restoreBtn').onclick = () => $('restoreFile').click();

$('restoreFile').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (!confirm(t('restoreConfirm'))) return;
  try {
    toast(t('working'));
    const payload = JSON.parse(await file.text());
    await restoreData(payload);
    toast(t('restored'));
    await loadClasses();
    await loadDay();
  } catch (err) {
    toast(t('restoreFail', err.message), true);
  }
};

async function restoreData(p) {
  if (!p || !Array.isArray(p.classes) || !Array.isArray(p.students)) throw new Error(t('badBackup'));

  const savedClasses = await upsertChunks('classes',
    p.classes.map(c => ({ name: c.name, sort_order: c.sort_order ?? 0 })),
    { onConflict: 'name' });
  const classByName = new Map(savedClasses.map(c => [c.name, c.id]));
  const oldClassToNew = new Map(p.classes.map(c => [c.id, classByName.get(c.name)]));

  const savedStudents = await upsertChunks('students',
    p.students.map(s => ({
      name: s.name,
      admission_no: String(s.admission_no),
      mobile: String(s.mobile),
      section: s.section ?? null,
      sim_number: s.sim_number ?? null,
      father_name: s.father_name ?? null,
      address: s.address ?? null,
      face_descriptor: s.face_descriptor ?? null,
      roll_number: s.roll_number ?? null,
      date_of_birth: s.date_of_birth ?? null,
      gender: s.gender ?? null,
      monthly_fee: s.monthly_fee ?? null,
      admission_date: s.admission_date ?? null,
      previous_school: s.previous_school ?? null,
      class_id: oldClassToNew.get(s.class_id) ?? null,
      is_active: s.is_active !== false
    })),
    { onConflict: 'admission_no' });
  const studentByAdm = new Map(savedStudents.map(s => [String(s.admission_no), s.id]));
  const oldStudentToNew = new Map(p.students.map(s => [s.id, studentByAdm.get(String(s.admission_no))]));

  const attRows = (p.attendance || [])
    .map(a => ({
      student_id: oldStudentToNew.get(a.student_id),
      date: a.date,
      status: a.status,
      updated_by: null
    }))
    .filter(r => r.student_id);
  await upsertChunks('attendance', attRows, { onConflict: 'student_id,date' });

  const logRows = (p.message_logs || [])
    .map(m => ({
      student_id: oldStudentToNew.get(m.student_id),
      date: m.date,
      channel: m.channel,
      sent_by: null
    }))
    .filter(r => r.student_id);
  if (logRows.length) await insertChunks('message_logs', logRows);
}

applyLang();
boot();
</script>
