<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL SUFFAH PUBLIC HIGH SCHOOL – Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#0d6efd;--green:#198754;--teal:#0dcaf0;--orange:#fd7e14;--purple:#6f42c1;--red:#dc3545;--yellow:#ffc107;--pink:#d63384;--bg:#f0f4ff;--card:#ffffff;--text:#111827;--muted:#374151}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);margin:0;padding:12px;color:var(--text);-webkit-text-size-adjust:100%}
.ur{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif;line-height:1.9}
h2{margin:0;font-size:20px}
.school{font-size:20px;font-weight:900;letter-spacing:1px;text-align:center;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35);margin-bottom:8px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
header{background:linear-gradient(90deg,#4c1d95,#1d4ed8,#0891b2);color:#fff;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
header .user{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:bold;color:#111}
input,select,textarea{padding:9px;border:2px solid #9ca3af;border-radius:8px;font-size:16px;background:#fff;color:#111;max-width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:none;color:#fff;background-color:#6c757d;background-image:linear-gradient(to bottom,rgba(255,255,255,.28),rgba(0,0,0,.08));padding:9px 13px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:bold;text-shadow:0 1px 1px rgba(0,0,0,.25);box-shadow:0 4px 0 rgba(0,0,0,.28),0 6px 12px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s,filter .2s;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.primary{background-color:var(--blue)}
.btn.success{background-color:var(--green)}
.btn.wa{background-color:#25D366}
.btn.sms{background-color:var(--teal);color:#000;text-shadow:none}
.btn.purple{background-color:var(--purple)}
.btn.pink{background-color:var(--pink)}
.btn.yellow{background-color:var(--yellow);color:#000;text-shadow:none}
.btn.dark{background-color:#374151}
.btn.del{background-color:var(--red)}
.btn.ghost{background-color:rgba(255,255,255,.2);border:1px solid #fff;color:#fff}
.btn.edit{background-color:#f59e0b;color:#000;text-shadow:none}
.btn.teal{background-color:#0f766e}
.btn.face{background-color:#7c3aed}
.btn.call{background-color:#2563eb}
.btn.form{background-color:#0f766e}
.summary{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;align-items:center}
.chip{padding:6px 12px;border-radius:20px;font-weight:bold;background:#e5e7eb;color:#111}
.chip.total{background:#e0e7ff;color:#3730a3}
.chip.P{background:#d1fae5;color:#065f46}
.chip.A{background:#fee2e2;color:#991b1b}
.chip.L{background:#fef3c7;color:#92400e}
.chip.T{background:#ffedd5;color:#9a3412}
.chip.pct{background:#ede9fe;color:#5b21b6}
.bar{flex:1;min-width:160px;height:14px;background:#e5e7eb;border-radius:10px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399);transition:width .4s}
.table-wrap{overflow-x:auto;padding:0;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px;color:#111}
th,td{border:1px solid #d1d5db;padding:7px;text-align:center;color:#111}
th{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;position:sticky;top:0}
tr:nth-child(even) td{background:#fafafa}
.status{border:none;padding:7px 10px;border-radius:8px;cursor:pointer;font-weight:bold;min-width:120px;transition:transform .1s}
.status:active{transform:scale(.95)}
.status.P{background:#d1fae5;color:#065f46}
.status.A{background:#fee2e2;color:#991b1b}
.status.L{background:#fef3c7;color:#92400e}
.status.T{background:#ffedd5;color:#9a3412}
.nowrap{white-space:nowrap}
.empty{padding:20px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.warn{color:#dc2626;font-weight:bold}
.alert{background:#fff7ed;border:2px solid #fb923c;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.alert.red{background:#fef2f2;border-color:#f87171}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:linear-gradient(135deg,#ffffff,#eef2ff);border-radius:14px;padding:12px;text-align:center;box-shadow:0 6px 14px rgba(79,70,229,.15);cursor:pointer;transition:transform .15s}
.kpi:hover{transform:translateY(-3px)}
.kpi b{display:block;font-size:24px;color:#3730a3}
.kpi span{font-size:12px;color:var(--muted)}
.cam{background:#000;border-radius:12px;overflow:hidden;margin:10px 0}
.cam video{width:100%;display:block;transform:scaleX(-1)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;margin:-12px;background:linear-gradient(135deg,#6f42c1,#0d6efd,#0dcaf0)}
.login-card{width:min(360px,92vw);display:grid;gap:12px}
.msg{color:#dc2626;font-size:13px;margin:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:10px;z-index:50}
.modal-box{background:#fff;border-radius:14px;padding:18px;width:min(900px,100%);max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.form{display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sectionTitle{font-weight:bold;color:#4c1d95;border-bottom:2px solid #c4b5fd;padding-bottom:3px;margin-top:6px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
select.lang{background:#fff;color:#111;padding:6px;font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.3s;z-index:60;font-weight:bold;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
@media print{
  .btn,.hint,.toolbar,.actions,header,#toast,.kpis,.alert{display:none!important}
  body{background:#fff}
  body.print-modal #app{display:none!important}
  body.print-modal #modal{position:static;background:none}
  body.print-modal .modal-box{box-shadow:none;max-height:none;overflow:visible}
}
#tbody .btn.call{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
#tbody .btn.wa{background:linear-gradient(135deg,#25d366,#128c7e)}
#tbody .btn.sms{background:linear-gradient(135deg,#06b6d4,#0e7490);color:#fff}
#tbody .btn.copy{background:linear-gradient(135deg,#f97316,#c2410c)}
#tbody .btn.file{background:linear-gradient(135deg,#64748b,#334155)}
#tbody .btn.face{background:linear-gradient(135deg,#a855f7,#6d28d9)}
#tbody .btn.purple{background:linear-gradient(135deg,#ec4899,#be185d)}
#tbody .btn.form{background:linear-gradient(135deg,#14b8a6,#0f766e)}
#tbody .btn.edit{background:linear-gradient(135deg,#facc15,#ca8a04);color:#000}
#tbody .btn.del{background:linear-gradient(135deg,#ef4444,#991b1b)}
#tbody .btn.fee{background:linear-gradient(135deg,#10b981,#065f46)}
#addBtn{background:linear-gradient(135deg,#3b82f6,#1d4ed8)!important}
#markAllBtn{background:linear-gradient(135deg,#22c55e,#15803d)!important}
#faceCheckBtn{background:linear-gradient(135deg,#a855f7,#6d28d9)!important}
#sendAbsentBtn{background:linear-gradient(135deg,#25d366,#128c7e)!important}
#showAbsentBtn{background:linear-gradient(135deg,#ec4899,#be185d)!important}
#dailyBtn{background:linear-gradient(135deg,#8b5cf6,#5b21b6)!important}
#weeklyBtn{background:linear-gradient(135deg,#06b6d4,#0e7490)!important}
#monthlyBtn{background:linear-gradient(135deg,#14b8a6,#0f766e)!important}
#csvBtn{background:linear-gradient(135deg,#facc15,#ca8a04)!important;color:#000}
#printBtn{background:linear-gradient(135deg,#475569,#1e293b)!important}
#refreshBtn{background:linear-gradient(135deg,#60a5fa,#2563eb)!important}
#backupBtn{background:linear-gradient(135deg,#2dd4bf,#0f766e)!important}
#restoreBtn{background:linear-gradient(135deg,#f97316,#c2410c)!important}
#resetDayBtn{background:linear-gradient(135deg,#ef4444,#991b1b)!important}
a.btn[href="fees.html"]{background:linear-gradient(135deg,#f59e0b,#b45309)!important}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="card login-card">
    <div class="school" style="color:#4c1d95;text-shadow:none">AL SUFFAH PUBLIC HIGH SCHOOL</div>
    <input id="loginPhone" type="tel" placeholder="Mobile number (e.g. 03001234567)" autocomplete="username">
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn primary" id="loginBtn">🔐 Login</button>
    <p id="loginMsg" class="msg"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="school" style="width:100%">🏫 AL SUFFAH PUBLIC HIGH SCHOOL</div>
    <div class="user">
      <span id="userPhone"></span>
      <select id="langPick" class="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="ur">اردو</option>
      </select>
      <button class="btn ghost" id="logoutBtn">Logout</button>
    </div>
  </header>

  <div id="alertBox"></div>
  <section class="kpis" id="kpis"></section>

  <section class="card toolbar">
    <label><span id="l-date">📅 Date</span> <input type="date" id="datePick"></label>
    <label><span id="l-class">🎓 Class</span> <select id="classPick"></select></label>
    <label><span id="l-search">🔍 Search</span> <input id="search" placeholder="Name or admission no."></label>
    <button class="btn primary" id="addBtn">➕ Add student</button>
    <button class="btn success" id="markAllBtn">✅ Mark all present</button>
    <button class="btn face" id="faceCheckBtn">📷 Face check-in</button>
  </section>

  <section class="card summary" id="summary"></section>

  <section class="card actions">
    <label><span id="l-msgLang">Parent message language:</span>
      <select id="msgLangPick" class="lang">
        <option value="ur">اردو</option>
        <option value="en">English</option>
      </select>
    </label>
    <button class="btn wa" id="sendAbsentBtn">📩 Message parents of absent students</button>
    <button class="btn pink" id="showAbsentBtn">🚫 Absent students</button>
    <button class="btn purple" id="dailyBtn">📊 Daily report</button>
    <button class="btn purple" id="weeklyBtn">📈 Weekly report</button>
    <button class="btn purple" id="monthlyBtn">📉 Monthly report</button>
    <button class="btn yellow" id="csvBtn">📥 Export CSV</button>
    <button class="btn dark" id="printBtn">🖨️ Print / PDF</button>
    <a class="btn purple" href="fees.html">💰 فیس سسٹم / Fees</a>
    <button class="btn" id="refreshBtn">🔄 Refresh</button>
    <button class="btn teal" id="backupBtn">💾 Backup</button>
    <button class="btn teal" id="restoreBtn">📤 Restore backup</button>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
    <input type="file" id="fileInput" hidden>
    <button class="btn del" id="resetDayBtn">♻️ Reset this day</button>
  </section>

  <div class="card table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Name</th><th>Admission No</th><th>Status</th><th>Mobile</th>
          <th>Message</th><th>Edit</th><th>Delete</th><th>💰 Due</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p class="hint">Click the status button: P (Present) → A (Absent) → L (Leave) → T (Late). Every change is saved immediately.</p>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3 id="modalTitle" style="margin-top:0"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions"><button class="btn dark" id="modalClose">Close</button></div>
  </div>
</div>

<div id="toast"></div>
